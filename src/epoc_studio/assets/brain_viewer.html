          domCache.progBar.style.cursor = "default";
        }
        setCachedText(domCache.playbackElapsed, "elapsed", elapsedStr);
        setPlaybackBarRatio(1.0);
      }

      // 1. Artifact Warning
      if (!isStreamActive) {
        setStatusIndicator("status-dot idle", "IDLE — READY");
      } else if (isPlaybackPaused) {
        setStatusIndicator("status-dot paused", "PAUSED");
      } else if (data.artifact) {
        setStatusIndicator("status-dot artifact", "EMG ARTIFACT CLAMPED");
      } else if (sseSource && sseSource.readyState === EventSource.OPEN) {
        setStatusIndicator("status-dot online", "STREAM ACTIVE");
      }

      // 2. Global Cognitive Indices
      setCachedText(domCache.metricAlphaProm, "alphaProm", Math.round(data.alpha_prominence * 100) + "%");
      setCachedText(domCache.metricEngagement, "engagement", data.engagement.toFixed(2));
      if (typeof data.baseline_locked === "boolean" && !isCalibratingActive) {
        if (data.baseline_locked !== isBaselineLocked) {
          isBaselineLocked = data.baseline_locked;
          const bBtn = domCache.btnCalibrate;
          if (bBtn) {
            if (isBaselineLocked) {
              bBtn.textContent = "🔒 Locked Baseline (Reset)";
              bBtn.style.borderColor = "#22c55e";
              bBtn.style.color = "#22c55e";
            } else {
              bBtn.textContent = "Calibrate 5s Baseline";
              bBtn.style.borderColor = "rgba(56, 189, 248, 0.4)";
              bBtn.style.color = "#38bdf8";
            }
          }
        }
      }

      // 3. Update Wave Band Pills
      const regions = data.regions;
      if (!regions) return;

      // Compute global average band distribution
      const bandSums = { alpha: 0, beta: 0, theta: 0, gamma: 0, delta: 0 };
      let rCount = 0;
      for (const rKey in regions) {
        if (regions[rKey].no_data) continue;
        const bands = regions[rKey].bands;
        for (const b in bandSums) bandSums[b] += bands[b] || 0;
        rCount++;
      }
      if (rCount > 0) {
        const bandAvgs = {};
        for (const b in bandSums) {
          const avg = bandSums[b] / rCount;
          bandAvgs[b] = avg;
          setCachedText(domCache.bandVals[b], "val_" + b, Math.round(avg * 100) + "%");
        }

        const enabledBands = BAND_KEYS.filter(b => isBandEnabled(b));
        if (enabledBands.length > 0) {
          if (data.global_dominant && isBandEnabled(data.global_dominant)) {
            lastGlobalDominant = data.global_dominant;
          } else {
            lastGlobalDominant = enabledBands.reduce((a, b) => ((bandAvgs[a] || 0) >= (bandAvgs[b] || 0) ? a : b), enabledBands[0]);
          }
        } else {
          lastGlobalDominant = null;
        }

        const sampleKey = `${data.session_id || 0}_${data.timestamp}_${data.sample_count}`;
        if (isStreamActive && (sampleKey !== lastGraphSampleKey || (!isPlaybackPaused && bandHistory.alpha.length === 0))) {
          lastGraphSampleKey = sampleKey;
          for (const b of BAND_KEYS) {
            bandHistory[b].push(bandAvgs[b] || 0);
            if (bandHistory[b].length > BAND_HISTORY_MAX) {
              bandHistory[b].shift();
            }
          }
          bandGraphsDirty = true;
        }
      }

      // 4. Update Each Anatomical Lobe Target Intensity and Color
      const enabledBands = BAND_KEYS.filter(b => isBandEnabled(b));
      for (let i = 0; i < lobeKeys.length; i++) {
        const key = lobeKeys[i];
        const mesh = lobeMeshes[key];
        const rData = regions[key];
        if (!rData) continue;
        if (rData.no_data) {   // no electrode over this region: dark, nothing to show
          mesh.userData.targetAct = 0.0;
          mesh.userData.targetColor.setHex(INACTIVE_COLOR);
          continue;
        }

        let act = 0.0;
        let colorHex = 0x38bdf8;

        if (selectedBandMode === "all") {
          // Dominant frequency mode among active (enabled) bands
          let dom = rData.dominant;
          if (!isBandEnabled(dom)) {
            if (enabledBands.length > 0) {
              dom = enabledBands.reduce((best, b) => ((rData.bands[b] || 0) > (rData.bands[best] || 0) ? b : best), enabledBands[0]);
            } else {
              dom = null;
            }
          }
          if (dom && BAND_COLORS[dom] !== undefined) {
            colorHex = BAND_COLORS[dom];
            const bandVal = rData.bands[dom] || 0.0;
            // Match single-band mode scaling: [0.10, 0.45] -> [0.0, 1.0]
            act = Math.min(1.0, Math.max(0.0, (bandVal - 0.10) / 0.35));
          } else {
            colorHex = 0x38bdf8;
            act = 0.05;
          }
        } else {
          // Target band inspection (e.g. ALPHA)
          const bandVal = rData.bands[selectedBandMode] || 0.0;
          // Scale from [0.10, 0.45] to [0.0, 1.0]
          act = Math.min(1.0, Math.max(0.0, (bandVal - 0.10) / 0.35));
          colorHex = BAND_COLORS[selectedBandMode];
        }

        mesh.userData.targetAct = act;
        mesh.userData.targetColor.setHex(colorHex);


      }
    }

    // -------------------------------------------------------------------------
    // Interactive Raycaster (Hover to Inspect Lobe — Throttled for Performance)
    // -------------------------------------------------------------------------
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2(-1000, -1000);
    const tooltip = document.getElementById("tooltip");
    const RAYCAST_INTERVAL_MS = 85;
    let pointerDirty = false;
    let pointerOverCanvas = false;
    let pointerClientX = 0;
    let pointerClientY = 0;
    let lastRaycastTime = 0;
    let tooltipRefs = null;

    function ensureTooltipRefs() {
      if (tooltipRefs) return tooltipRefs;
      tooltip.textContent = "";
      const labelEl = document.createElement("div");
      labelEl.style.cssText = "font-weight:700; color:#38bdf8; margin-bottom:4px;";
      const chRow = document.createElement("div");
      chRow.appendChild(document.createTextNode("Channels: "));
      const chSpan = document.createElement("span");
      chSpan.style.cssText = "font-family:monospace; color:#94a3b8;";
      chRow.appendChild(chSpan);

      const dataGroup = document.createElement("div");
      const domRow = document.createElement("div");
      domRow.appendChild(document.createTextNode("Dominant: "));
      const domVal = document.createElement("b");
      domRow.appendChild(domVal);

      const actRow = document.createElement("div");
      actRow.appendChild(document.createTextNode("Activity: "));
      const actVal = document.createElement("b");
      actRow.appendChild(actVal);

      const bandsRow = document.createElement("div");
      bandsRow.style.cssText = "font-size:9px; color:#64748b; margin-top:4px;";

      dataGroup.appendChild(domRow);
      dataGroup.appendChild(actRow);
      dataGroup.appendChild(bandsRow);
      tooltip.appendChild(labelEl);
      tooltip.appendChild(chRow);
      tooltip.appendChild(dataGroup);

      tooltipRefs = { labelEl, chSpan, dataGroup, domRow, actRow, domVal, actVal, bandsRow };
      return tooltipRefs;
    }

    function hideTooltip() {
      if (domCache.lastValues._ttVis !== false) {
        domCache.lastValues._ttVis = false;
        tooltip.style.display = "none";
      }
    }

    const hoverCandidates = [];

    // Build a watertight vertex-clustered proxy mesh (~350 tris/lobe) so hover raycasting
    // avoids walking 5,000-7,500+ triangles per lobe on dense GLB meshes.
    function createRaycastProxyMesh(mesh) {
      const geo = mesh && mesh.geometry;
      const proxyGeo = decimateGeometryByGrid(geo, 7, 350);
      if (!proxyGeo) return mesh;

      const proxy = new THREE.Mesh(proxyGeo, mesh.material);
      proxy.matrixAutoUpdate = false;
      proxy.matrix.copy(mesh.matrixWorld);
      proxy.matrixWorld.copy(mesh.matrixWorld);
      proxy.userData = mesh.userData;
      return proxy;
    }

    function updateHoverTooltip(nowMs) {
      if (!pointerOverCanvas || isOrbitDragging || lobeMeshList.length === 0) {
        hideTooltip();
        return;
      }
      if (!pointerDirty || nowMs - lastRaycastTime < RAYCAST_INTERVAL_MS) {
        return;
      }
      pointerDirty = false;
      lastRaycastTime = nowMs;

      raycaster.setFromCamera(mouse, camera);
      hoverCandidates.length = 0;
      for (let i = 0; i < lobeMeshList.length; i++) {
        const m = lobeMeshList[i];
        if (!m.userData.worldBox || raycaster.ray.intersectsBox(m.userData.worldBox)) {
          hoverCandidates.push(m.userData.raycastProxy || m);
        }
      }
      const intersects = hoverCandidates.length > 0 ? raycaster.intersectObjects(hoverCandidates, false) : [];

      if (intersects.length > 0) {
        const hit = intersects[0].object;
        const conf = hit.userData.config;
        const key = hit.userData.regionKey;
        const rData = currentEEGData && currentEEGData.regions ? currentEEGData.regions[key] : null;
        const tt = ensureTooltipRefs();

        if (domCache.lastValues._ttVis !== true) {
          domCache.lastValues._ttVis = true;
          tooltip.style.display = "block";
        }
        tooltip.style.transform = `translate3d(${pointerClientX}px, ${pointerClientY}px, 0) translate(-50%, -120%)`;

        setCachedText(tt.labelEl, "_ttLabel", conf.label);
        const noData = !!(rData && rData.no_data);
        const chList = rData && Array.isArray(rData.channels) ? rData.channels : conf.channels;
        setCachedText(tt.chSpan, "_ttCh", noData ? "no electrode" : chList.join(", "));

        let displayBands = rData && !noData ? rData.bands : null;
        let displayDom = rData ? rData.dominant : null;
        if (!displayBands && !noData && conf.interpolatedFrom && currentEEGData && currentEEGData.regions) {
          const avgBands = { delta: 0, theta: 0, alpha: 0, beta: 0, gamma: 0 };
          let nCount = 0;
          for (const nKey of conf.interpolatedFrom) {
            const nr = currentEEGData.regions[nKey];
            if (nr && nr.bands && !nr.no_data) {
              for (const b of BAND_KEYS) avgBands[b] += nr.bands[b] || 0;
              nCount++;
            }
          }
          if (nCount > 0) {
            for (const b of BAND_KEYS) avgBands[b] /= nCount;
            displayBands = avgBands;
            displayDom = BAND_KEYS.reduce((best, b) => (avgBands[b] > avgBands[best] ? b : best), BAND_KEYS[0]);
          }
        }

        if (displayBands) {
          if (domCache.lastValues._ttDataVis !== true) {
            domCache.lastValues._ttDataVis = true;
            tt.dataGroup.style.display = "";
            tt.domRow.style.display = "";
            tt.actRow.style.display = "";
          }
          const enabledBands = BAND_KEYS.filter(b => isBandEnabled(b));
          let dom = displayDom;
          if (!isBandEnabled(dom)) {
            if (enabledBands.length > 0) {
              dom = enabledBands.reduce((best, b) => ((displayBands[b] || 0) > (displayBands[best] || 0) ? b : best), enabledBands[0]);
            } else {
              dom = null;
            }
          }
          const domHex = dom && BAND_COLORS[dom] ? "#" + BAND_COLORS[dom].toString(16).padStart(6, "0") : "#94a3b8";
          const domText = dom ? dom.toUpperCase() : "NONE";
          if (domCache.lastValues._ttDomHex !== domHex) {
            domCache.lastValues._ttDomHex = domHex;
            tt.domVal.style.color = domHex;
          }
          setCachedText(tt.domVal, "_ttDom", domText);
          setCachedText(tt.actVal, "_ttAct", Math.round(hit.userData.currentAct * 100) + "%");
          const suffix = conf.interpolatedFrom ? " (interpolated)" : "";
          setCachedText(
            tt.bandsRow,
            "_ttBands",
            `α: ${Math.round(displayBands.alpha * 100)}% | β: ${Math.round(displayBands.beta * 100)}% | θ: ${Math.round(displayBands.theta * 100)}%${suffix}`
          );
        } else if (domCache.lastValues._ttDataVis !== false) {
          domCache.lastValues._ttDataVis = false;
          tt.dataGroup.style.display = "none";
        }
      } else {
        hideTooltip();
      }
    }

    window.addEventListener("mousemove", (event) => {
      if (event.target !== renderer.domElement || isOrbitDragging) {
        pointerOverCanvas = false;
        hideTooltip();
        return;
      }
      pointerOverCanvas = true;
      pointerClientX = event.clientX;
      pointerClientY = event.clientY;
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      pointerDirty = true;
      if (tooltip.style.display === "block") {
        tooltip.style.transform = `translate3d(${pointerClientX}px, ${pointerClientY}px, 0) translate(-50%, -120%)`;
      }
    });

    // -------------------------------------------------------------------------
    // Animation Loop with Smooth LERP & Glow Post-Processing
    // -------------------------------------------------------------------------
    const clock = new THREE.Clock();
    let lastRenderedSliderOpacity = -1;
    let lastIdleRenderMs = 0;

    function animate() {
      requestAnimationFrame(animate);

      if (document.hidden) {
        clock.getDelta();
        return;
      }

      let hadNewData = false;
      if (pendingSSEData !== null) {
        const latest = pendingSSEData;
        pendingSSEData = null;
        onBrainDataReceived(latest);
        hadNewData = true;
      }

      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      // Controls damping
      controls.update();

      // Sync zoom readout/slider when camera distance or target changes
      const curZoomDist = camera.position.distanceTo(controls.target);
      let cameraMoved = false;
      if (
        Math.abs(curZoomDist - lastCheckedZoomDist) > 1e-3 ||
        controls.target.distanceToSquared(lastCheckedTarget) > 1e-6
      ) {
        cameraMoved = true;
        lastCheckedZoomDist = curZoomDist;
        lastCheckedTarget.copy(controls.target);
        if (typeof syncZoomUI === "function") syncZoomUI();
      }

      // Dynamic Camera-Distance Sorting for Transparent Rendering (only when camera moved)
      if (lobeKeys.length > 0 && (needsRenderOrderSort || camera.position.distanceToSquared(lastSortCamPos) > 1e-4)) {
        cameraMoved = true;
        needsRenderOrderSort = false;
        lastSortCamPos.copy(camera.position);
        lobeKeys.sort((a, b) => {
          const distA = lobeMeshes[a].userData.centroid.distanceToSquared(camera.position);
          const distB = lobeMeshes[b].userData.centroid.distanceToSquared(camera.position);
          return distB - distA; // Farthest first, closest last
        });
        for (let i = 0; i < lobeKeys.length; i++) {
          const k = lobeKeys[i];
          lobeMeshes[k].renderOrder = 10 + i;
          if (lobeEdges[k]) lobeEdges[k].renderOrder = 10 + i;
        }
      }

      const sliderOpacity = cachedOutlineOpacity;
      const opacityChanged = Math.abs(sliderOpacity - lastRenderedSliderOpacity) > 1e-4;

      // Determine outline color matching currently most active band (fallback to default INACTIVE_EDGE_OBJ)
      let activeBandKey = null;
      if (selectedBandMode !== "all" && isBandEnabled(selectedBandMode) && BAND_COLORS[selectedBandMode] !== undefined) {
        activeBandKey = selectedBandMode;
      } else if (lastGlobalDominant && isBandEnabled(lastGlobalDominant) && BAND_COLORS[lastGlobalDominant] !== undefined) {
        activeBandKey = lastGlobalDominant;
      }

      if (activeBandKey && BAND_COLORS[activeBandKey] !== undefined) {
        targetOutlineColor.setHex(BAND_COLORS[activeBandKey]);
      } else {
        targetOutlineColor.copy(INACTIVE_EDGE_OBJ);
      }

      // Smoothly interpolate outline color to ensure transitions are smooth when active band shifts
      currentOutlineColor.lerp(targetOutlineColor, Math.min(1.0, delta * 4.0));

      // Smoothly interpolate lobe activation, matter brightness, and outline visibility
      const lerpStep = Math.min(1.0, delta * 5.5);
      let maxActDelta = 0.0;
      for (let i = 0; i < lobeKeys.length; i++) {
        const key = lobeKeys[i];
        const mesh = lobeMeshes[key];
        const u = mesh.userData;
        if (u.config && u.config.interpolatedFrom) continue;

        const dAct = Math.abs(u.targetAct - u.currentAct);
        if (dAct > maxActDelta) maxActDelta = dAct;
        // Smooth LERP for both activity and color (no threshold jumps)
        u.currentAct += (u.targetAct - u.currentAct) * lerpStep;
        if (!u.colorInitialized && u.targetColor.getHex() !== 0x000000) {
          u.currentColor.copy(u.targetColor);
          u.colorInitialized = true;
        } else {
          u.currentColor.lerp(u.targetColor, lerpStep);
        }

        const act = Math.max(0.0, Math.min(1.0, u.currentAct));
        const glowFactor = Math.pow(act, 1.35);
        const volumeDensity = Math.pow(act, 0.6);

        const mat = mesh.material;
        const edge = lobeEdges[key].material;

        // Let directional lights sculpt active lobes via diffuse color while keeping peak glow via emissive
        mat.opacity = 0.14 + volumeDensity * 0.72;
        mat.color.copy(INACTIVE_COLOR_OBJ).lerp(u.currentColor, 0.15 + act * 0.85);
        mat.emissive.copy(u.currentColor);
        mat.emissiveIntensity = act * 0.35 + glowFactor * 1.45;

        // Outlines stay at a stable value corresponding only to the Visual Controls slider,
        // and match the color of the currently most active band
        edge.opacity = sliderOpacity;
        edge.visible = sliderOpacity > 0.001;
        edge.color.copy(currentOutlineColor);
      }

      // Update interpolated dorsal crown meshes from their 4 same-hemisphere active neighbors
      for (let i = 0; i < lobeKeys.length; i++) {
        const key = lobeKeys[i];
        const mesh = lobeMeshes[key];
        const u = mesh.userData;
        if (!u.config || !u.config.interpolatedFrom || !u.interpUniforms) continue;

        const nKeys = u.config.interpolatedFrom;
        let actSum = 0.0;
        let nCount = 0;
        for (let k = 0; k < 4; k++) {
          const nMesh = lobeMeshes[nKeys[k]];
          const nAct = nMesh ? Math.max(0.0, Math.min(1.0, nMesh.userData.currentAct)) : 0.0;
          const nCol = nMesh ? nMesh.userData.currentColor : INACTIVE_COLOR_OBJ;
          u.interpUniforms["uNeighborColor" + k].value.copy(nCol);
          u.interpUniforms.uNeighborActs.value.setComponent(k, nAct);
          actSum += nAct;
          nCount++;
        }
        u.currentAct = nCount > 0 ? actSum / nCount : 0.0;

        const edge = lobeEdges[key].material;
        edge.opacity = sliderOpacity;
        edge.visible = sliderOpacity > 0.001;
        edge.color.copy(currentOutlineColor);
      }

      // Noncortical structures only need updates when outline slider changes
      if (opacityChanged) {
        lastRenderedSliderOpacity = sliderOpacity;
        for (let i = 0; i < noncorticalEdges.length; i++) {
          const nEdge = noncorticalEdges[i];
          nEdge.material.opacity = sliderOpacity * 0.65;
          nEdge.material.visible = sliderOpacity > 0.001;
          nEdge.material.color.copy(INACTIVE_EDGE_OBJ);
        }
      }

      const nowMs = performance.now();
      if (bandGraphsDirty && nowMs - lastGraphRenderMs >= GRAPH_RENDER_INTERVAL_MS) {
        renderAllBandGraphs();
      }

      updateHoverTooltip(nowMs);

      const isActiveScene =
        hadNewData ||
        cameraMoved ||
        opacityChanged ||
        controls.autoRotate ||
        isOrbitDragging ||
        pointerDirty ||
        maxActDelta > 5e-4 ||
        (!isStreamPaused && isStreamActive);

      if (!isActiveScene && nowMs - lastIdleRenderMs < 120) {
        return;
      }
      lastIdleRenderMs = nowMs;

      // Gentle floating animation of particles
      particles.rotation.y = time * 0.02;

      // Render through UnrealBloom Composer (skip post-processing pass if bloom is off)
      if (bloomPass && bloomPass.strength > 0.01) {
        composer.render();
      } else {
        renderer.render(scene, camera);
      }
    }

    // -------------------------------------------------------------------------
    // UI Event Listeners (Band Selection, Sliders, Calibration)
    // -------------------------------------------------------------------------
    document.querySelectorAll(".band-btn").forEach(btn => {
      const band = btn.dataset.band;
      const swatch = btn.querySelector(".band-swatch");

      // Swatch (colored dot) toggle handler:
      // Clicking the dot disables the band (grayscale + disappears from all bands view) or activates it
      if (swatch && band !== "all") {
        swatch.title = `Disable ${band.toUpperCase()} band`;
        swatch.setAttribute("aria-label", `Toggle ${band} band`);
        swatch.addEventListener("click", (e) => {
          e.stopPropagation(); // Do not trigger line click
          const willEnable = !isBandEnabled(band);
          setBandEnabled(band, willEnable);
        });
      }

      // Whole line click handler:
      // When clicked again or when disabled, activates the band AND selects it only
      btn.addEventListener("click", () => {
        const wasDisabled = band !== "all" && !isBandEnabled(band);
        const wasActive = btn.classList.contains("active");
        const wasExpanded = btn.classList.contains("expanded");

        if (wasDisabled) {
          // Both activate the band and select it only
          bandEnabledState[band] = true;
          btn.classList.remove("band-disabled");
          if (swatch) {
            swatch.title = `Disable ${band.toUpperCase()} band`;
            swatch.setAttribute("aria-label", `Disable ${band} band`);
          }
        }

        document.querySelectorAll(".band-btn").forEach(b => {
          b.classList.remove("active");
          b.classList.remove("expanded");
        });
        btn.classList.add("active");
        if (wasDisabled || !wasActive || !wasExpanded) {
          btn.classList.add("expanded");
        }
        selectedBandMode = band;
        if (currentEEGData) onBrainDataReceived(currentEEGData);
        renderAllBandGraphs(true);
      });
    });

    renderAllBandGraphs(true);

    document.getElementById("bloomSlider").addEventListener("input", (e) => {
      if (bloomPass) bloomPass.strength = parseFloat(e.target.value);
    });

    document.getElementById("outlineSlider").addEventListener("input", (e) => {
      const v = parseFloat(e.target.value);
      cachedOutlineOpacity = isNaN(v) ? 0.3 : v;
    });

    document.getElementById("autoRotateCheck").addEventListener("change", (e) => {
      controls.autoRotate = e.target.checked;
    });

    const zoomSlider = document.getElementById("zoomSlider");
    const zoomValueEl = document.getElementById("zoomValue");
    let isZoomSliderActive = false;

    function distanceToZoomFactor(dist) {
      return DEFAULT_CAMERA_DISTANCE / Math.max(0.1, dist);
    }

    function zoomSliderToFactor(sliderVal) {
      return Math.pow(2, (sliderVal - 50) / 50);
    }

    function zoomFactorToSlider(factor) {
      return Math.min(100, Math.max(0, Math.round(50 + 50 * Math.log2(Math.max(0.1, factor)))));
    }

    function syncZoomUI() {
      const dist = camera.position.distanceTo(controls.target);
      const factor = distanceToZoomFactor(dist);
      const pct = Math.round(factor * 100);
      setCachedText(zoomValueEl, "_zoomPct", pct + "%");
      if (!isZoomSliderActive && zoomSlider) {
        const targetSlider = String(zoomFactorToSlider(factor));
        if (zoomSlider.value !== targetSlider) {
          zoomSlider.value = targetSlider;
        }
      }
    }

    if (zoomSlider) {
      const applyZoomFromSlider = () => {
        const raw = parseFloat(zoomSlider.value);
        const factor = zoomSliderToFactor(isNaN(raw) ? 50 : raw);
        const targetDist = Math.min(
          controls.maxDistance,
          Math.max(controls.minDistance, DEFAULT_CAMERA_DISTANCE / factor)
        );
        _zoomOffsetVec.subVectors(camera.position, controls.target);
        if (_zoomOffsetVec.lengthSq() < 1e-8) {
          _zoomOffsetVec.copy(DEFAULT_CAMERA_POS);
        }
        _zoomOffsetVec.normalize().multiplyScalar(targetDist);
        camera.position.copy(controls.target).add(_zoomOffsetVec);
        controls.update();
        lastCheckedZoomDist = camera.position.distanceTo(controls.target);
        lastCheckedTarget.copy(controls.target);
        setCachedText(zoomValueEl, "_zoomPct", Math.round(distanceToZoomFactor(lastCheckedZoomDist) * 100) + "%");
      };
      zoomSlider.addEventListener("pointerdown", () => { isZoomSliderActive = true; });
      window.addEventListener("pointerup", () => { isZoomSliderActive = false; });
      zoomSlider.addEventListener("input", applyZoomFromSlider);
      zoomSlider.addEventListener("change", () => {
        isZoomSliderActive = false;
        applyZoomFromSlider();
      });
    }

    // Prevent browser/WebEngine page zoom (e.g. Ctrl+wheel or trackpad pinch over HUD windows)
    // so zooming only affects the 3D brain, not the HUD window sizes.
    window.addEventListener("wheel", (e) => {
      if (e.ctrlKey || e.metaKey) {
        e.preventDefault();
      }
    }, { passive: false });

    document.getElementById("btnPause").addEventListener("click", () => {
      togglePause();
    });

    // Interactive Timeline Scrubbing / Seeking
    const progressBarEl = document.getElementById("playbackProgressBar");
    function seekFromEvent(e, forceSend = false) {
      if (!progressBarEl) return;
      const rect = progressBarEl.getBoundingClientRect();
      if (rect.width <= 0) return;
      const clientX = (e.touches && e.touches.length > 0) ? e.touches[0].clientX : e.clientX;
      if (typeof clientX !== "number") return;
      const ratio = Math.min(1, Math.max(0, (clientX - rect.left) / rect.width));
      const dur = (currentEEGData && currentEEGData.duration_sec > 0) ? currentEEGData.duration_sec : lastKnownDuration;
      const targetSec = dur > 0 ? ratio * dur : null;

      setPlaybackBarRatio(ratio);
      if (domCache.playbackElapsed && targetSec !== null) {
        setCachedText(domCache.playbackElapsed, "elapsed", `${formatClockSec(targetSec)} / ${formatClockSec(dur)}`);
      }

      const now = performance.now();
      if (forceSend || now - lastSeekFetchTime > 50) {
        lastSeekFetchTime = now;
        const seq = ++seekSequence;
        seekPendingSince = now;
        pendingSSEData = null;
        const payload = targetSec !== null ? { elapsed_sec: targetSec, progress: ratio } : { progress: ratio };
        fetch(API + "/api/seek" + devQ(), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        })
          .then(r => r.json())
          .then(res => {
            if (seq !== seekSequence) return;
            seekPendingSince = 0;
            if (res && res.frame) {
              onBrainDataReceived(res.frame);
            }
          })
          .catch(err => {
            if (seq === seekSequence) seekPendingSince = 0;
            console.error("Seek error", err);
          });
      }
    }

    if (progressBarEl) {
      const startScrub = (e) => {
        if (e.button !== undefined && e.button !== 0) return;
        const dur = (currentEEGData && currentEEGData.duration_sec > 0) ? currentEEGData.duration_sec : lastKnownDuration;
        if (!(dur > 0) || (currentEEGData && currentEEGData.can_seek === false)) return;
        e.preventDefault();
        e.stopPropagation();
        isScrubbing = true;
        progressBarEl.classList.add("scrubbing");
        seekFromEvent(e, true);
      };

      const moveScrub = (e) => {
        if (!isScrubbing) return;
        e.preventDefault();
        seekFromEvent(e, false);
      };

      const endScrub = (e) => {
        if (!isScrubbing) return;
        seekFromEvent(e, true);
        isScrubbing = false;
        progressBarEl.classList.remove("scrubbing");
        if (typeof revealPanels === "function" && isAutoHideMode() && !arePanelsStillHovered()) {
          revealPanels(false);
        }
      };

      progressBarEl.addEventListener("mousedown", startScrub);
      window.addEventListener("mousemove", moveScrub);
      window.addEventListener("mouseup", endScrub);
      window.addEventListener("blur", endScrub);

      progressBarEl.addEventListener("touchstart", startScrub, { passive: false });
      window.addEventListener("touchmove", moveScrub, { passive: false });
      window.addEventListener("touchend", endScrub);
      window.addEventListener("touchcancel", endScrub);
    }

    window.addEventListener("keydown", (e) => {
      if (e.key === "F11") {
        e.preventDefault();
        toggleFullscreen(true);
        return;
      }
      if (e.key === "Escape") {
        const isFsNow = !!(document.fullscreenElement || document.webkitFullscreenElement || document.body.classList.contains("fullscreen-mode"));
        if (isFsNow) {
          e.preventDefault();
          toggleFullscreen(false);
          return;
        }
      }
      if (!document.activeElement || !["INPUT", "BUTTON", "SELECT", "TEXTAREA"].includes(document.activeElement.tagName)) {
        if (e.code === "Space") {
          e.preventDefault();
          togglePause();
        } else if (e.key === "f" || e.key === "F") {
          e.preventDefault();
          toggleFullscreen();
        }
      }
    });

    let isBaselineLocked = false;
    let isCalibratingActive = false;

    const btnCalibrate = document.getElementById("btnCalibrate");
    btnCalibrate.addEventListener("click", () => {
      if (isCalibratingActive) return;

      if (isBaselineLocked) {
        // Unlock and return to auto-rolling baseline
        fetch(API + "/api/calibrate" + devQ(), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ reset: true })
        })
          .then(r => r.json())
          .then(() => {
            isBaselineLocked = false;
            btnCalibrate.textContent = "Calibrate 5s Baseline";
            btnCalibrate.style.borderColor = "rgba(56, 189, 248, 0.4)";
            btnCalibrate.style.color = "#38bdf8";
          })
          .catch(err => console.error("Reset baseline error", err));
        return;
      }

      // Start 5-second baseline capture and lock
      isCalibratingActive = true;
      btnCalibrate.textContent = "CALIBRATING (5s)...";
      btnCalibrate.style.borderColor = "#eab308";
      btnCalibrate.style.color = "#eab308";

      fetch(API + "/api/calibrate" + devQ(), { method: "POST" })
        .then(r => r.json())
        .then(() => {
          setTimeout(() => {
            isCalibratingActive = false;
            isBaselineLocked = true;
            btnCalibrate.textContent = "🔒 Locked Baseline (Reset)";
            btnCalibrate.style.borderColor = "#22c55e";
            btnCalibrate.style.color = "#22c55e";
          }, 5000);
        })
        .catch(err => {
          isCalibratingActive = false;
          console.error("Calibration error", err);
          btnCalibrate.textContent = "Calibrate 5s Baseline";
          btnCalibrate.style.borderColor = "rgba(56, 189, 248, 0.4)";
          btnCalibrate.style.color = "#38bdf8";
        });
    });

    // -------------------------------------------------------------------------
    // Fullscreen & Narrow Window Auto-Hide Mode + Interactive Edge Drawer System
    // -------------------------------------------------------------------------
    const DEFAULT_PANEL_WIDTH = 280;
    const MIN_PANEL_WIDTH = 232;
    const PANEL_OUTER_MARGIN = 24;

    const statusBadgeEl = document.querySelector(".status-badge.hud");
    const sidebarEl = document.querySelector(".sidebar.hud");
    const inspectorEl = document.querySelector(".inspector.hud");
    const edgeTriggerLeft = document.getElementById("edgeTriggerLeft");
    const edgeTriggerRight = document.getElementById("edgeTriggerRight");
    const btnFullscreen = document.getElementById("btnFullscreen");

    let currentPanelWidth = DEFAULT_PANEL_WIDTH;
    let panelsHideTimer = null;
    let fullscreenTransitionCooldown = false;

    function applyPanelWidth(widthPx) {
      const w = Math.round(widthPx);
      if (w === currentPanelWidth) return;
      currentPanelWidth = w;
      if (sidebarEl) sidebarEl.style.width = w + "px";
      if (inspectorEl) inspectorEl.style.width = w + "px";
      invalidateHudMetrics();
    }

    function isAutoHideMode() {
      return (
        document.body.classList.contains("fullscreen-mode") ||
        document.body.classList.contains("narrow-mode")
      );
    }

    function arePanelsStillHovered() {
      return (
        (sidebarEl && sidebarEl.matches(":hover")) ||
        (inspectorEl && inspectorEl.matches(":hover")) ||
        (statusBadgeEl && statusBadgeEl.matches(":hover")) ||
        (edgeTriggerLeft && edgeTriggerLeft.matches(":hover")) ||
        (edgeTriggerRight && edgeTriggerRight.matches(":hover")) ||
        isScrubbing
      );
    }

    function updateNarrowMode() {
      // Evaluate side-panel fit against the unzoomed, centered brain framing so
      // zooming or panning the 3D brain never resizes or hides the side windows.
      const dist = DEFAULT_CAMERA_DISTANCE;
      const halfFovTan = Math.tan(THREE.MathUtils.degToRad(camera.fov * 0.5));
      const r = brainHalfWidthWorld;

      let brainHalfWidthPx;
      if (dist <= r + 0.05) {
        brainHalfWidthPx = window.innerWidth;
      } else {
        const tanAlpha = r / Math.sqrt(dist * dist - r * r);
        brainHalfWidthPx = (tanAlpha / halfFovTan) * (window.innerHeight * 0.5);
      }

      const brainCenterPx = window.innerWidth * 0.5;

      const spaceLeft = (brainCenterPx - brainHalfWidthPx) - PANEL_OUTER_MARGIN;
      const spaceRight = (window.innerWidth - PANEL_OUTER_MARGIN) - (brainCenterPx + brainHalfWidthPx);
      const fittingWidth = Math.floor(Math.min(spaceLeft, spaceRight));

      const currentlyNarrow = document.body.classList.contains("narrow-mode");
      const minRequired = currentlyNarrow ? (MIN_PANEL_WIDTH + 6) : MIN_PANEL_WIDTH;
      const fitsWithShrunkPanels = fittingWidth >= minRequired;
      const shouldBeNarrow = !fitsWithShrunkPanels;

      if (shouldBeNarrow !== currentlyNarrow) {
        document.body.classList.toggle("narrow-mode", shouldBeNarrow);
        if (!isAutoHideMode()) {
          if (panelsHideTimer) { clearTimeout(panelsHideTimer); panelsHideTimer = null; }
          if (sidebarEl) sidebarEl.classList.remove("revealed");
          if (inspectorEl) inspectorEl.classList.remove("revealed");
          if (statusBadgeEl) statusBadgeEl.classList.remove("revealed");
          if (bandGraphsDirty) renderAllBandGraphs(true);
        }
      }

      if (document.body.classList.contains("fullscreen-mode") || shouldBeNarrow) {
        const maxOverlayWidth = Math.max(MIN_PANEL_WIDTH, Math.floor((window.innerWidth - 64) / 2));
        applyPanelWidth(Math.min(DEFAULT_PANEL_WIDTH, maxOverlayWidth));
      } else {
        applyPanelWidth(Math.min(DEFAULT_PANEL_WIDTH, fittingWidth));
      }
    }

    // OrbitControls drag detection to avoid drawer popping while actively orbiting
    if (typeof controls !== "undefined" && controls) {
      controls.addEventListener("start", () => { isOrbitDragging = true; });
      controls.addEventListener("end", () => { isOrbitDragging = false; });
    }

    function revealPanels(show) {
      if (!isAutoHideMode()) return;
      if (fullscreenTransitionCooldown) return;
      if (show) {
        if (panelsHideTimer) {
          clearTimeout(panelsHideTimer);
          panelsHideTimer = null;
        }
        if (!isOrbitDragging) {
          if (sidebarEl) sidebarEl.classList.add("revealed");
          if (inspectorEl) inspectorEl.classList.add("revealed");
          if (statusBadgeEl && document.body.classList.contains("fullscreen-mode")) {
            statusBadgeEl.classList.add("revealed");
          }
          if (bandGraphsDirty) renderAllBandGraphs(true);
        }
      } else {
        if (!panelsHideTimer) {
          panelsHideTimer = setTimeout(() => {
            panelsHideTimer = null;
            if (!arePanelsStillHovered()) {
              if (sidebarEl) sidebarEl.classList.remove("revealed");
              if (inspectorEl) inspectorEl.classList.remove("revealed");
              if (statusBadgeEl) statusBadgeEl.classList.remove("revealed");
            }
          }, 320);
        }
      }
    }

    const panelsBtn = document.getElementById("panelsBtn");
    if (panelsBtn) {
      panelsBtn.addEventListener("click", () => {
        const open = sidebarEl && sidebarEl.classList.contains("revealed");
        if (open) {
          if (panelsHideTimer) { clearTimeout(panelsHideTimer); panelsHideTimer = null; }
          if (sidebarEl) sidebarEl.classList.remove("revealed");
          if (inspectorEl) inspectorEl.classList.remove("revealed");
          if (statusBadgeEl) statusBadgeEl.classList.remove("revealed");
        } else {
          revealPanels(true);
        }
      });
    }

    if (edgeTriggerLeft) {
      edgeTriggerLeft.addEventListener("mouseenter", () => revealPanels(true));
      edgeTriggerLeft.addEventListener("mouseleave", () => revealPanels(false));
      edgeTriggerLeft.addEventListener("touchstart", () => revealPanels(true), { passive: true });
    }
    if (sidebarEl) {
      sidebarEl.addEventListener("mouseenter", () => revealPanels(true));
      sidebarEl.addEventListener("mouseleave", () => revealPanels(false));
    }

    if (edgeTriggerRight) {
      edgeTriggerRight.addEventListener("mouseenter", () => revealPanels(true));
      edgeTriggerRight.addEventListener("mouseleave", () => revealPanels(false));
      edgeTriggerRight.addEventListener("touchstart", () => revealPanels(true), { passive: true });
    }
    if (inspectorEl) {
      inspectorEl.addEventListener("mouseenter", () => revealPanels(true));
      inspectorEl.addEventListener("mouseleave", () => revealPanels(false));
    }
    if (statusBadgeEl) {
      statusBadgeEl.addEventListener("mouseenter", () => revealPanels(true));
      statusBadgeEl.addEventListener("mouseleave", () => revealPanels(false));
    }

    // Precise cursor edge detection across the viewport
    window.addEventListener("mousemove", (e) => {
      if (!isAutoHideMode() || isOrbitDragging || fullscreenTransitionCooldown) return;

      // Either left or right edge hover reveals both side windows
      if (e.clientX <= 28 || e.clientX >= window.innerWidth - 28) {
        revealPanels(true);
        return;
      }

      const anyRevealed =
        (sidebarEl && sidebarEl.classList.contains("revealed")) ||
        (inspectorEl && inspectorEl.classList.contains("revealed")) ||
        (statusBadgeEl && statusBadgeEl.classList.contains("revealed"));
      if (anyRevealed && !arePanelsStillHovered()) {
        const leftRect = sidebarEl ? sidebarEl.getBoundingClientRect() : null;
        const rightRect = inspectorEl ? inspectorEl.getBoundingClientRect() : null;
        const nearLeft = leftRect ? e.clientX <= leftRect.right + 24 : false;
        const nearRight = rightRect ? e.clientX >= rightRect.left - 24 : false;
        if (!nearLeft && !nearRight) {
          revealPanels(false);
        }
      }
    });

    document.addEventListener("mouseleave", () => {
      if (isAutoHideMode()) {
        revealPanels(false);
      }
    });

    function setFullscreenUI(active) {
      if (active) {
        fullscreenTransitionCooldown = true;
        document.body.classList.add("fullscreen-mode");
        if (panelsHideTimer) { clearTimeout(panelsHideTimer); panelsHideTimer = null; }
        if (sidebarEl) sidebarEl.classList.remove("revealed");
        if (inspectorEl) inspectorEl.classList.remove("revealed");
        if (statusBadgeEl) statusBadgeEl.classList.remove("revealed");
        if (btnFullscreen) {
          btnFullscreen.textContent = "⛶ Exit Fullscreen";
          btnFullscreen.classList.add("fullscreen-active");
        }
        updateNarrowMode();
        setTimeout(() => {
          fullscreenTransitionCooldown = false;
        }, 450);
      } else {
        fullscreenTransitionCooldown = false;
        document.body.classList.remove("fullscreen-mode");
        if (panelsHideTimer) { clearTimeout(panelsHideTimer); panelsHideTimer = null; }
        if (sidebarEl) sidebarEl.classList.remove("revealed");
        if (inspectorEl) inspectorEl.classList.remove("revealed");
        if (statusBadgeEl) statusBadgeEl.classList.remove("revealed");
        if (btnFullscreen) {
          btnFullscreen.textContent = "⛶ Fullscreen";
          btnFullscreen.classList.remove("fullscreen-active");
        }
        updateNarrowMode();
        if (!isAutoHideMode() && bandGraphsDirty) renderAllBandGraphs(true);
      }
    }

    function toggleFullscreen(forceState) {
      const isFsNow = !!(document.fullscreenElement || document.webkitFullscreenElement || document.body.classList.contains("fullscreen-mode"));
      const targetState = (forceState !== undefined) ? forceState : !isFsNow;

      if (targetState) {
        const el = document.documentElement;
        if (el.requestFullscreen) {
          el.requestFullscreen().catch(() => {});
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        }
        setFullscreenUI(true);
      } else {
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          if (document.exitFullscreen) {
            document.exitFullscreen().catch(() => {});
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
        setFullscreenUI(false);
      }
    }

    if (btnFullscreen) {
      btnFullscreen.addEventListener("click", () => {
        toggleFullscreen();
      });
    }

    document.addEventListener("fullscreenchange", () => {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      setFullscreenUI(isFs);
    });
    document.addEventListener("webkitfullscreenchange", () => {
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);
      setFullscreenUI(isFs);
    });

    // Window Resize Handling
    window.addEventListener("resize", () => {
      renderDpr = computeRenderDpr();
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(renderDpr);
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setPixelRatio(renderDpr);
      composer.setSize(window.innerWidth, window.innerHeight);
      invalidateHudMetrics();
      updateNarrowMode();
      renderAllBandGraphs(true);
    });

    syncZoomUI();
    updateNarrowMode();
    animate();
  </script>
</body>
</html>
