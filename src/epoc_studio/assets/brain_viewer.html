<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D BRAIN VIEWER</title>
  <style>
    :root {
      --bg: #030508;
      --card-bg: rgba(8, 14, 24, 0.88);
      --border: rgba(40, 60, 95, 0.4);
      --border-bright: rgba(80, 130, 200, 0.6);
      --text: #e2e8f0;
      --muted: #64748b;
      --accent: #38bdf8;
      --alpha-color: #a855f7;
      --beta-color: #22c55e;
      --theta-color: #facc15;
      --gamma-color: #ec4899;
      --delta-color: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      user-select: none;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Holographic UI Overlay */
    .hud {
      position: absolute;
      z-index: 10;
      pointer-events: none;
    }
    .interactive {
      pointer-events: auto;
    }

    /* Top-Right Status Badge */
    .status-badge.hud {
      top: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      letter-spacing: 0.05em;
      transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s ease;
      will-change: transform, opacity;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e2e8f0;
      transition: background 0.2s;
    }
    .status-dot.online { background: #22c55e; }
    .status-dot.paused { background: #eab308; }
    .status-dot.idle { background: #94a3b8; }
    .status-dot.artifact { background: #eab308; }
    .status-dot.offline { background: #ef4444; }

    /* Left Control Sidebar */
    .sidebar.hud {
      top: 24px;
      left: 24px;
      width: 280px;
      max-height: calc(100vh - 48px);
      padding-bottom: 2px;
      overflow-y: auto;
      scrollbar-width: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s ease;
      will-change: transform, opacity;
    }
    .sidebar.hud::-webkit-scrollbar {
      display: none;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      contain: layout style;
      transition: border-color 0.2s;
    }
    .card:hover {
      border-color: var(--border-bright);
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Wave Band Selectors */
    .band-pills {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .band-btn {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      justify-content: flex-start;
      width: 100%;
      text-align: left;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(50, 70, 100, 0.3);
      padding: 7px 10px;
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, opacity 0.2s;
    }
    .band-btn:hover {
      background: rgba(30, 41, 59, 0.8);
      border-color: rgba(100, 150, 220, 0.5);
    }
    .band-btn.active {
      border-color: currentColor;
      background: rgba(30, 45, 75, 0.9);
    }
    .band-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }
    .band-title-group {
      display: flex;
      align-items: center;
    }
    .band-meta {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .band-chevron {
      font-size: 9px;
      color: var(--muted);
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), color 0.2s;
      display: inline-block;
      line-height: 1;
    }
    .band-btn.expanded .band-chevron {
      transform: rotate(180deg);
      color: currentColor;
    }
    .band-swatch {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      margin-right: 8px;
      flex-shrink: 0;
      cursor: pointer;
      position: relative;
      transition: transform 0.18s ease, filter 0.18s ease, box-shadow 0.2s ease, opacity 0.18s ease, background 0.2s ease;
    }
    .band-swatch::after {
      content: "";
      position: absolute;
      top: -6px;
      left: -6px;
      right: -6px;
      bottom: -6px;
      border-radius: 50%;
    }
    .band-swatch:hover {
      transform: scale(1.35);
      filter: brightness(1.25);
    }
    .band-swatch:active {
      transform: scale(0.92);
    }
    .band-btn[data-band="all"] .band-swatch {
      cursor: default;
    }
    .band-btn[data-band="all"] .band-swatch:hover {
      transform: none;
      filter: none;
    }
    .band-btn.band-disabled {
      filter: grayscale(100%);
      opacity: 0.42;
      border-color: rgba(75, 85, 99, 0.3) !important;
      box-shadow: none !important;
    }
    .band-btn.band-disabled:hover {
      opacity: 0.72;
      border-color: rgba(148, 163, 184, 0.35) !important;
    }
    .band-btn.band-disabled .band-swatch {
      background: #64748b !important;
      box-shadow: none !important;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .band-btn.band-disabled .band-swatch:hover {
      transform: scale(1.35);
      background: #94a3b8 !important;
      filter: brightness(1.3);
    }
    .band-val {
      font-family: monospace;
      font-size: 11px;
      color: var(--muted);
    }
    .band-graph-wrap {
      max-height: 0;
      opacity: 0;
      overflow: hidden;
      margin-top: 0;
      transition: max-height 0.28s cubic-bezier(0.4, 0, 0.2, 1),
                  opacity 0.22s ease,
                  margin-top 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .band-btn.expanded .band-graph-wrap {
      max-height: 76px;
      opacity: 1;
      margin-top: 8px;
    }
    .band-graph-box {
      background: rgba(4, 8, 16, 0.82);
      border: 1px solid rgba(56, 189, 248, 0.18);
      border-radius: 6px;
      padding: 5px 7px 6px 7px;
      contain: layout style;
    }
    .band-btn.active .band-graph-box {
      border-color: rgba(148, 163, 184, 0.28);
    }
    .band-svg {
      display: block;
      width: 100%;
      height: 54px;
      border-radius: 3px;
      overflow: visible;
      transform: translateZ(0);
      contain: layout style;
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .metric-box {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(50, 70, 100, 0.2);
      border-radius: 6px;
      padding: 8px;
      text-align: center;
    }
    .metric-num {
      font-size: 18px;
      font-weight: 700;
      color: #38bdf8;
      font-family: monospace;
    }
    .metric-lbl {
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Sliders & Toggles */
    .control-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
    }
    .control-row label {
      color: var(--text);
      font-size: 11px;
      white-space: nowrap;
    }
    input[type=range] {
      flex: 1;
      min-width: 68px;
      max-width: 110px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    .btn-action {
      width: 100%;
      padding: 8px 6px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      border-radius: 6px;
      color: #38bdf8;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-action:hover {
      background: rgba(56, 189, 248, 0.3);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }
    .btn-action.paused {
      background: rgba(234, 179, 8, 0.18);
      border-color: rgba(234, 179, 8, 0.6);
      color: #eab308;
      box-shadow: 0 0 12px rgba(234, 179, 8, 0.25);
    }
    .btn-action.paused:hover {
      background: rgba(234, 179, 8, 0.3);
      box-shadow: 0 0 16px rgba(234, 179, 8, 0.45);
    }
    .btn-action.idle {
      background: rgba(34, 197, 94, 0.18);
      border-color: rgba(34, 197, 94, 0.6);
      color: #4ade80;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.22);
    }
    .btn-action.idle:hover {
      background: rgba(34, 197, 94, 0.3);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.4);
    }
    .playback-progress-bg {
      position: relative;
      width: 100%;
      height: 6px;
      background: rgba(30, 41, 59, 0.85);
      border-radius: 3px;
      margin: 14px 0 14px 0;
      cursor: pointer;
      touch-action: none;
    }
    .playback-progress-bg::before {
      content: "";
      position: absolute;
      top: -8px;
      bottom: -8px;
      left: 0;
      right: 0;
      cursor: pointer;
    }
    .playback-progress-fill {
      position: relative;
      height: 100%;
      width: 100%;
      transform-origin: left center;
      transform: scaleX(0);
      will-change: transform;
      background: var(--accent);
      border-radius: 3px;
      pointer-events: none;
    }
    .playback-progress-thumb {
      position: absolute;
      left: 0;
      top: 50%;
      margin-left: -7px;
      transform: translate3d(var(--thumb-x, 0px), -50%, 0);
      will-change: transform;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f8fafc;
      border: 2px solid var(--accent);
      cursor: pointer;
      pointer-events: auto;
    }
    .playback-progress-bg:hover .playback-progress-thumb,
    .playback-progress-bg.scrubbing .playback-progress-thumb {
      transform: translate3d(var(--thumb-x, 0px), -50%, 0) scale(1.25);
    }

    /* Right Control Sidebar */
    .inspector.hud {
      top: 68px;
      right: 24px;
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: transform 0.38s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.28s ease;
      will-change: transform, opacity;
    }

    /* Fullscreen & Narrow Window Auto-Hide Mode */
    body.fullscreen-mode .status-badge.hud {
      transform: translateX(calc(100% + 32px));
      opacity: 0;
      pointer-events: none;
    }
    body.fullscreen-mode .status-badge.hud.revealed {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
      z-index: 30;
    }

    body.fullscreen-mode .sidebar.hud,
    body.narrow-mode .sidebar.hud {
      transform: translateX(calc(-100% - 32px));
      opacity: 0;
      pointer-events: none;
    }
    body.fullscreen-mode .sidebar.hud.revealed,
    body.narrow-mode .sidebar.hud.revealed {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
      z-index: 30;
    }

    body.fullscreen-mode .inspector.hud,
    body.narrow-mode .inspector.hud {
      transform: translateX(calc(100% + 32px));
      opacity: 0;
      pointer-events: none;
    }
    body.fullscreen-mode .inspector.hud.revealed,
    body.narrow-mode .inspector.hud.revealed {
      transform: translateX(0);
      opacity: 1;
      pointer-events: auto;
      z-index: 30;
    }

    /* Edge Hover Trigger Hitboxes */
    .edge-trigger {
      display: none;
      position: fixed;
      top: 0;
      bottom: 0;
      width: 28px;
      z-index: 25;
      pointer-events: auto;
    }
    body.fullscreen-mode .edge-trigger,
    body.narrow-mode .edge-trigger {
      display: block;
    }
    .edge-trigger-left {
      left: 0;
    }
    .edge-trigger-right {
      right: 0;
    }

    /* Active state for fullscreen button */
    .btn-action.fullscreen-active {
      background: rgba(56, 189, 248, 0.32);
      border-color: #38bdf8;
    }

    /* Floating Tooltip */
    #tooltip {
      position: absolute;
      left: 0;
      top: 0;
      display: none;
      pointer-events: none;
      z-index: 50;
      background: rgba(3, 7, 18, 0.94);
      border: 1px solid var(--accent);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 11px;
      will-change: transform;
      contain: layout style paint;
      transform: translate(-50%, -120%);
    }

    /* Device bar (LSL web server): logger link, device choice, panels button for touch screens */
    .device-bar.hud {
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 40;
    }
    .device-bar .chip {
      font: inherit;
      font-size: 12px;
      color: var(--text);
      background: var(--card-bg);
      border: 1px solid var(--border-bright);
      border-radius: 20px;
      padding: 6px 12px;
      text-decoration: none;
      cursor: pointer;
      white-space: nowrap;
    }
    .device-bar select.chip { max-width: 55vw; }
    .device-bar select.chip option { background: #0b1220; }
    .device-bar #panelsBtn { display: none; }
    body.narrow-mode .device-bar #panelsBtn { display: inline-block; }
    body.narrow-mode .device-bar.hud { top: 12px; left: 12px; transform: none; }
    body.narrow-mode .status-badge.hud { top: 56px; right: 12px; }
    body.narrow-mode #fpsCounter { display: none; }
    /* live streams: no Session Playback (nothing to pause or seek); the live head map instead */
    body.live-only #playbackCard { display: none; }
    body.live-only #headmapCard { display: block !important; }
    .headmap-box { position: relative; width: 180px; height: 180px; margin: 6px auto 2px; border-radius: 8px; overflow: hidden; background: #0b1220; }
    .headmap-box img { width: 100%; height: 100%; display: block; }
    .headmap-lost { display: none; position: absolute; inset: 0; align-items: center; justify-content: center;
      background: rgba(3, 5, 8, 0.6); color: #ef4444; font-size: 12px; font-weight: 700; letter-spacing: 0.08em; }
    .headmap-box.lost .headmap-lost { display: flex; }
    .headmap-box.lost img { filter: grayscale(1); opacity: 0.45; }
  </style>
  <!-- Load Three.js, OrbitControls, and GLTFLoader (vendored locally for offline desktop use) -->
  <script src="vendor/three/three.min.js"></script>
  <script src="vendor/three/OrbitControls.js"></script>
  <script src="vendor/three/GLTFLoader.js"></script>
  <!-- Post-processing for UnrealBloom (Glow) -->
  <script src="vendor/three/EffectComposer.js"></script>
  <script src="vendor/three/RenderPass.js"></script>
  <script src="vendor/three/ShaderPass.js"></script>
  <script src="vendor/three/CopyShader.js"></script>
  <script src="vendor/three/LuminosityHighPassShader.js"></script>
  <script src="vendor/three/UnrealBloomPass.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="tooltip"></div>
  <div id="edgeTriggerLeft" class="edge-trigger edge-trigger-left" aria-hidden="true"></div>
  <div id="edgeTriggerRight" class="edge-trigger edge-trigger-right" aria-hidden="true"></div>

  <!-- Device bar: back to the logger, which EEG device, panels (touch) -->
  <div class="device-bar hud interactive">
    <a id="backLink" class="chip" href="/" style="display:none">&larr; Logger</a>
    <select id="deviceSel" class="chip" title="EEG device" style="display:none"></select>
    <button id="panelsBtn" class="chip" title="Show / hide the panels">&#9776;</button>
  </div>

  <!-- Top-Right Status Badge -->
  <div class="status-badge hud">
    <div id="statusDot" class="status-dot"></div>
    <span id="statusText">CONNECTING...</span>
    <span id="fpsCounter" style="color:var(--muted); margin-left:6px; font-family:monospace;">-- FPS</span>
  </div>

  <!-- Left Control Sidebar -->
  <aside class="sidebar hud interactive">
    <!-- Wave Band Inspector & Selector -->
    <div class="card">
      <div class="card-title">
        <span>Brain Waves</span>
        <span style="font-size:9px; color:var(--muted)">TARGET BAND</span>
      </div>
      <div class="band-pills">
        <button class="band-btn active expanded" data-band="all" style="color:#f8fafc">
          <div class="band-header">
            <div class="band-title-group"><span class="band-swatch" style="background:#f8fafc;"></span>All Bands (Dominant)</div>
            <div class="band-meta">
              <span class="band-val">AUTO</span>
              <span class="band-chevron">▾</span>
            </div>
          </div>
          <div class="band-graph-wrap">
            <div class="band-graph-box">
              <svg class="band-svg" data-svg-band="all" viewBox="0 0 210 54" preserveAspectRatio="none"></svg>
            </div>
          </div>
        </button>
        <button class="band-btn" data-band="alpha" style="color:var(--alpha-color)">
          <div class="band-header">
            <div class="band-title-group"><span class="band-swatch" style="background:var(--alpha-color);"></span>Alpha (8-12 Hz)</div>
            <div class="band-meta">
              <span class="band-val" id="valAlpha">0%</span>
              <span class="band-chevron">▾</span>
            </div>
          </div>
          <div class="band-graph-wrap">
            <div class="band-graph-box">
              <svg class="band-svg" data-svg-band="alpha" viewBox="0 0 210 54" preserveAspectRatio="none"></svg>
            </div>
          </div>
        </button>
        <button class="band-btn" data-band="beta" style="color:var(--beta-color)">
          <div class="band-header">
            <div class="band-title-group"><span class="band-swatch" style="background:var(--beta-color);"></span>Beta (12-30 Hz)</div>
            <div class="band-meta">
              <span class="band-val" id="valBeta">0%</span>
              <span class="band-chevron">▾</span>
            </div>
          </div>
          <div class="band-graph-wrap">
            <div class="band-graph-box">
              <svg class="band-svg" data-svg-band="beta" viewBox="0 0 210 54" preserveAspectRatio="none"></svg>
            </div>
          </div>
        </button>
        <button class="band-btn" data-band="theta" style="color:var(--theta-color)">
          <div class="band-header">
            <div class="band-title-group"><span class="band-swatch" style="background:var(--theta-color);"></span>Theta (4-8 Hz)</div>
            <div class="band-meta">
              <span class="band-val" id="valTheta">0%</span>
              <span class="band-chevron">▾</span>
            </div>
          </div>
          <div class="band-graph-wrap">
            <div class="band-graph-box">
              <svg class="band-svg" data-svg-band="theta" viewBox="0 0 210 54" preserveAspectRatio="none"></svg>
            </div>
          </div>
        </button>
        <button class="band-btn" data-band="gamma" style="color:var(--gamma-color)">
          <div class="band-header">
            <div class="band-title-group"><span class="band-swatch" style="background:var(--gamma-color);"></span>Gamma (30-45 Hz)</div>
            <div class="band-meta">
              <span class="band-val" id="valGamma">0%</span>
              <span class="band-chevron">▾</span>
            </div>
          </div>
          <div class="band-graph-wrap">
            <div class="band-graph-box">
              <svg class="band-svg" data-svg-band="gamma" viewBox="0 0 210 54" preserveAspectRatio="none"></svg>
            </div>
          </div>
        </button>
        <button class="band-btn" data-band="delta" style="color:var(--delta-color)">
          <div class="band-header">
            <div class="band-title-group"><span class="band-swatch" style="background:var(--delta-color);"></span>Delta (1-4 Hz)</div>
            <div class="band-meta">
              <span class="band-val" id="valDelta">0%</span>
              <span class="band-chevron">▾</span>
            </div>
          </div>
          <div class="band-graph-wrap">
            <div class="band-graph-box">
              <svg class="band-svg" data-svg-band="delta" viewBox="0 0 210 54" preserveAspectRatio="none"></svg>
            </div>
          </div>
        </button>
      </div>
    </div>

    <!-- Real-time Cognitive State Metrics -->
    <div class="card">
      <div class="card-title">Live Cognitive Indices</div>
      <div class="metrics-grid">
        <div class="metric-box">
          <div class="metric-num" id="metricAlphaProm">--</div>
          <div class="metric-lbl">Alpha Relaxation</div>
        </div>
        <div class="metric-box">
          <div class="metric-num" id="metricEngagement">--</div>
          <div class="metric-lbl">Engagement Beta/(α+θ)</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- Right Control Sidebar -->
  <aside class="inspector hud interactive">
    <!-- Live head map of the chosen device (LSL backend); takes the place of Session Playback in live mode -->
    <div class="card" id="headmapCard" style="display:none">
      <div class="card-title">
        <span>Headmap</span>
        <span id="headmapLabel" style="font-size:9px; color:var(--muted)">LIVE</span>
      </div>
      <div class="headmap-box" id="headmapBox">
        <img id="headmapImg" alt="head map" width="180" height="180">
        <div class="headmap-lost">NO SIGNAL</div>
      </div>
    </div>

    <!-- Session Playback (replays only) -->
    <div class="card" id="playbackCard">
      <div class="card-title">
        <span>Session Playback</span>
        <span id="playbackModeLabel" style="font-size:9px; color:var(--muted)">REPLAY</span>
      </div>
      <div class="metric-box" style="padding:8px 10px;">
        <div class="metric-num" id="playbackElapsed" style="font-size:15px;">00:00.0</div>
        <div class="metric-lbl" id="playbackTimestamp" style="font-family:monospace; text-transform:none; letter-spacing:0.02em; margin-top:4px; font-size:10px; color:#94a3b8;">--</div>
      </div>
      <div class="playback-progress-bg" id="playbackProgressBar" title="Drag or click to seek through recording">
        <div class="playback-progress-fill" id="playbackProgress"></div>
        <div class="playback-progress-thumb" id="playbackProgressThumb"></div>
      </div>
      <button id="btnPause" class="btn-action">⏸ Pause Recording</button>
    </div>

    <!-- Visual Adjustments -->
    <div class="card">
      <div class="card-title">Visual Controls</div>
      <div class="control-row">
        <label>Zoom <span id="zoomValue" style="color:var(--muted); font-family:monospace; margin-left:4px;">100%</span></label>
        <input type="range" id="zoomSlider" min="0" max="100" step="1" value="50">
      </div>
      <div class="control-row">
        <label>Glow Bloom</label>
        <input type="range" id="bloomSlider" min="0" max="1.40" step="0.01" value="0.70">
      </div>
      <div class="control-row">
        <label>Outline Opacity</label>
        <input type="range" id="outlineSlider" min="0.05" max="0.8" step="0.05" value="0.3">
      </div>
      <div class="control-row">
        <label>Auto-Rotation</label>
        <input type="checkbox" id="autoRotateCheck" checked style="accent-color:var(--accent); cursor:pointer;">
      </div>
      <button id="btnCalibrate" class="btn-action" style="margin-top:6px;">Calibrate 5s Baseline</button>
      <button id="btnFullscreen" class="btn-action" style="margin-top:6px;">⛶ Fullscreen</button>
    </div>
  </aside>

  <!-- 3D WebGL / Three.js Application Logic -->
  <script>
    // -------------------------------------------------------------------------
    // Global Constants & State
    // -------------------------------------------------------------------------
    const BAND_COLORS = {
      delta: 0xef4444,
      theta: 0xfacc15,
      alpha: 0xa855f7,
      beta:  0x22c55e,
      gamma: 0xec4899
    };

    const INACTIVE_COLOR = 0x070d18;
    const INACTIVE_EDGE = 0x243b5e;
    const INACTIVE_COLOR_OBJ = new THREE.Color(INACTIVE_COLOR);
    const INACTIVE_EDGE_OBJ = new THREE.Color(INACTIVE_EDGE);

    const currentOutlineColor = new THREE.Color(INACTIVE_EDGE);
    const targetOutlineColor = new THREE.Color(INACTIVE_EDGE);

    // 8 Bilateral Active Cortical Regions + 2 Interpolated Parietal Regions
    const LOBE_CONFIG = {
      dorsal_frontal_left:  { label: "Dorsal Frontal L",  channels: ["AF3", "F3"], center: [ 0.42, 1.22,  0.79], radii: [0.65, 0.85, 1.25], rot: [0.1,  0.2, 0] },
      dorsal_frontal_right: { label: "Dorsal Frontal R",  channels: ["AF4", "F4"], center: [-0.42, 1.22,  0.80], radii: [0.65, 0.85, 1.25], rot: [0.1, -0.2, 0] },
      ventral_frontal_left: { label: "Ventral Frontal L", channels: ["F7", "FC5"], center: [ 0.90, 0.71,  0.86], radii: [0.50, 0.65, 0.68], rot: [0.05, 0.1, 0] },
      ventral_frontal_right:{ label: "Ventral Frontal R", channels: ["F8", "FC6"], center: [-0.91, 0.71,  0.87], radii: [0.50, 0.65, 0.68], rot: [0.05,-0.1, 0] },
      temporal_left:        { label: "Temporal L",        channels: ["T7", "P7"],  center: [ 0.96, 0.18, -0.28], radii: [0.65, 0.95, 1.40], rot: [-0.1, 0.1, 0.2] },
      temporal_right:       { label: "Temporal R",        channels: ["T8", "P8"],  center: [-0.95, 0.16, -0.26], radii: [0.65, 0.95, 1.40], rot: [-0.1,-0.1,-0.2] },
      occipital_left:       { label: "Occipital L",       channels: ["O1"],        center: [ 0.40, 0.03, -1.38], radii: [0.55, 0.60, 0.68], rot: [-0.2,-0.2, 0] },
      occipital_right:      { label: "Occipital R",       channels: ["O2"],        center: [-0.40, 0.03, -1.38], radii: [0.55, 0.60, 0.68], rot: [-0.2, 0.2, 0] },
      parietal_left:        { label: "Parietal L",        channels: ["--"],        interpolatedFrom: ["dorsal_frontal_left", "ventral_frontal_left", "temporal_left", "occipital_left"], center: [ 0.64, 1.05, -0.70], radii: [0.75, 0.90, 1.00], rot: [0, 0, 0] },
      parietal_right:       { label: "Parietal R",        channels: ["--"],        interpolatedFrom: ["dorsal_frontal_right", "ventral_frontal_right", "temporal_right", "occipital_right"], center: [-0.64, 1.05, -0.70], radii: [0.75, 0.90, 1.00], rot: [0, 0, 0] },
    };

    let selectedBandMode = "all"; // "all", "alpha", "beta", "theta", "gamma", "delta"
    let currentEEGData = null;
    let bloomPass = null;
    const lobeMeshes = {};
    const lobeEdges = {};
    let lobeKeys = [];
    let lobeMeshList = [];
    let needsRenderOrderSort = true;
    const lastSortCamPos = new THREE.Vector3(Infinity, Infinity, Infinity);
    const noncorticalEdges = [];
    let isOrbitDragging = false;
    let cachedOutlineOpacity = parseFloat(document.getElementById("outlineSlider").value);
    if (isNaN(cachedOutlineOpacity)) cachedOutlineOpacity = 0.3;

    // -------------------------------------------------------------------------
    // Three.js Scene, Camera, Renderer & Post-Processing Setup
    // -------------------------------------------------------------------------
    const container = document.getElementById("canvas-container");
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x030508);
    scene.fog = new THREE.FogExp2(0x030508, 0.08);

    const DEFAULT_CAMERA_POS = new THREE.Vector3(-5.22, 3.4, 0);
    const DEFAULT_CAMERA_DISTANCE = DEFAULT_CAMERA_POS.length();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.copy(DEFAULT_CAMERA_POS);

    const isQtWebEngine = /QtWebEngine/i.test(navigator.userAgent);
    // Render at full native DPI (capped at 1.5x for >QHD displays); shader/scene optimizations
    // offset the pixel fill cost so the grid, outlines, and brain stay razor-sharp.
    function computeRenderDpr() {
      const nativeDpr = window.devicePixelRatio || 1;
      return Math.min(nativeDpr, 1.5);
    }
    let renderDpr = computeRenderDpr();
    const renderer = new THREE.WebGLRenderer({ antialias: !isQtWebEngine, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(renderDpr);
    renderer.toneMapping = THREE.ReinhardToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = document.getElementById("autoRotateCheck").checked;
    controls.autoRotateSpeed = 0.8;
    controls.maxDistance = 12.5;
    controls.minDistance = 2;

    // Brain bounds & zoom tracking
    let brainHalfWidthWorld = 1.925;
    const _zoomOffsetVec = new THREE.Vector3();
    let lastCheckedZoomDist = -1;
    const lastCheckedTarget = new THREE.Vector3(Infinity, Infinity, Infinity);

    // Lighting (Key-to-fill contrast so gyri & sulci stay sculpted while preserving the dark look)
    const ambientLight = new THREE.HemisphereLight(0xe2e8f0, 0x090f1d, 0.42);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xf8fafc, 1.15);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x64748b, 0.35);
    fillLight.position.set(-6, -3, -5);
    scene.add(fillLight);

    // UnrealBloom Glow Post-Processing
    // On QtWebEngine, skip 64-bit HalfFloat FBOs and run the bloom mip chain at quarter resolution.
    const renderPass = new THREE.RenderPass(scene, camera);
    const initialBloomStrength = parseFloat(document.getElementById("bloomSlider").value);
    const bloomScale = isQtWebEngine ? 0.25 : 1.0;
    bloomPass = new THREE.UnrealBloomPass(
      new THREE.Vector2(
        Math.max(1, Math.floor(window.innerWidth * bloomScale)),
        Math.max(1, Math.floor(window.innerHeight * bloomScale))
      ),
      isNaN(initialBloomStrength) ? 0.70 : initialBloomStrength, // Strength
      0.55, // Radius
      0.28  // Threshold (high enough to keep dark lobes/outlines crisp, low enough for all bands to bloom)
    );
    const origBloomSetSize = bloomPass.setSize.bind(bloomPass);
    bloomPass.setSize = (w, h) => {
      origBloomSetSize(
        Math.max(1, Math.floor(w * bloomScale)),
        Math.max(1, Math.floor(h * bloomScale))
      );
    };
    const canHalfFloat = !isQtWebEngine && renderer.capabilities.isWebGL2 && (
      renderer.extensions.get("EXT_color_buffer_float") ||
      renderer.extensions.get("EXT_color_buffer_half_float")
    );
    const composerTarget = canHalfFloat
      ? new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight, {
          type: THREE.HalfFloatType,
          minFilter: THREE.LinearFilter,
          magFilter: THREE.LinearFilter,
          format: THREE.RGBAFormat,
        })
      : undefined;
    const composer = new THREE.EffectComposer(renderer, composerTarget);
    composer.setPixelRatio(renderDpr);
    composer.addPass(renderPass);
    composer.addPass(bloomPass);
    bloomPass.setSize(window.innerWidth * renderDpr, window.innerHeight * renderDpr);

    // Cyberpunk Pedestal Grid
    const gridHelper = new THREE.GridHelper(10, 20, 0x1e293b, 0x09101d);
    gridHelper.position.y = -2.2;
    scene.add(gridHelper);

    // Subtle Particle Dust Field in the Void
    const particleCount = 200;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      pPos[i] = (Math.random() - 0.5) * 15;
      pPos[i + 1] = (Math.random() - 0.5) * 10;
      pPos[i + 2] = (Math.random() - 0.5) * 15;
    }
    pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({ color: 0x38bdf8, size: 0.035, transparent: true, opacity: 0.4, depthWrite: false });
    const particles = new THREE.Points(pGeo, pMat);
    particles.renderOrder = 0;
    scene.add(particles);

    // -------------------------------------------------------------------------
    // Anatomical 3D Brain Mesh Construction (Segmented BodyParts3D Atlas GLB)
    // -------------------------------------------------------------------------
    const brainGroup = new THREE.Group();
    scene.add(brainGroup);

    // Build a watertight vertex-clustered BufferGeometry for fast hover raycasting
    // or simplifying opaque inner occluders without gaps.
    function decimateGeometryByGrid(geo, gridSize = 7, minTriCount = 350) {
      const posAttr = geo && geo.attributes && geo.attributes.position;
      if (!posAttr) return null;
      const index = geo.index;
      const triCount = Math.floor((index ? index.count : posAttr.count) / 3);
      if (triCount <= minTriCount) return null;

      if (!geo.boundingBox) geo.computeBoundingBox();
      const box = geo.boundingBox;
      const sx = Math.max(1e-6, box.max.x - box.min.x);
      const sy = Math.max(1e-6, box.max.y - box.min.y);
      const sz = Math.max(1e-6, box.max.z - box.min.z);
      const invX = (gridSize - 1) / sx;
      const invY = (gridSize - 1) / sy;
      const invZ = (gridSize - 1) / sz;

      const vCount = posAttr.count;
      const vertCluster = new Int32Array(vCount);
      const cellToCluster = new Map();
      const sumX = [], sumY = [], sumZ = [], counts = [];

      for (let v = 0; v < vCount; v++) {
        const vx = posAttr.getX(v);
        const vy = posAttr.getY(v);
        const vz = posAttr.getZ(v);
        const ix = Math.max(0, Math.min(gridSize - 1, ((vx - box.min.x) * invX) | 0));
        const iy = Math.max(0, Math.min(gridSize - 1, ((vy - box.min.y) * invY) | 0));
        const iz = Math.max(0, Math.min(gridSize - 1, ((vz - box.min.z) * invZ) | 0));
        const key = (ix * gridSize + iy) * gridSize + iz;
        let cid = cellToCluster.get(key);
        if (cid === undefined) {
          cid = sumX.length;
          cellToCluster.set(key, cid);
          sumX.push(0); sumY.push(0); sumZ.push(0); counts.push(0);
        }
        vertCluster[v] = cid;
        sumX[cid] += vx;
        sumY[cid] += vy;
        sumZ[cid] += vz;
        counts[cid]++;
      }

      const cCount = sumX.length;
      const clusteredPos = new Float32Array(cCount * 3);
      for (let c = 0; c < cCount; c++) {
        const inv = 1 / counts[c];
        clusteredPos[c * 3] = sumX[c] * inv;
        clusteredPos[c * 3 + 1] = sumY[c] * inv;
        clusteredPos[c * 3 + 2] = sumZ[c] * inv;
      }

      const indices = [];
      const seenTris = new Set();
      const stride = Math.max(1, cCount);
      for (let t = 0; t < triCount; t++) {
        const base = t * 3;
        const c0 = vertCluster[index ? index.getX(base) : base];
        const c1 = vertCluster[index ? index.getX(base + 1) : base + 1];
        const c2 = vertCluster[index ? index.getX(base + 2) : base + 2];
        if (c0 === c1 || c1 === c2 || c2 === c0) continue;
        const triKey = (c0 * stride + c1) * stride + c2;
        if (seenTris.has(triKey)) continue;
        seenTris.add(triKey);
        indices.push(c0, c1, c2);
      }

      if (indices.length < 12) return null;
      const decGeo = new THREE.BufferGeometry();
      decGeo.setAttribute("position", new THREE.BufferAttribute(clusteredPos, 3));
      decGeo.setIndex(indices);
      decGeo.computeBoundingBox();
      decGeo.computeBoundingSphere();
      return decGeo;
    }

    // Extracts ONLY the main anatomical outlines (major sulci creases and outward lobe contours),
    // discarding the thousands of flat internal slice-cut edges running inside the brain core.
    function createMainEdgesGeometry(geometry, thresholdDeg = 36) {
      const pos = geometry.attributes.position;
      const index = geometry.index;
      if (!pos || !index) return new THREE.EdgesGeometry(geometry, thresholdDeg);

      const cosThreshold = Math.cos(THREE.MathUtils.degToRad(thresholdDeg));
      const numFaces = index.count / 3;

      // Compute face normals
      const fnorms = new Float32Array(numFaces * 3);
      const pA = new THREE.Vector3(), pB = new THREE.Vector3(), pC = new THREE.Vector3();
      const cb = new THREE.Vector3(), ab = new THREE.Vector3();

      for (let i = 0; i < numFaces; i++) {
        const i3 = i * 3;
        const a = index.getX(i3), b = index.getX(i3 + 1), c = index.getX(i3 + 2);
        pA.fromBufferAttribute(pos, a);
        pB.fromBufferAttribute(pos, b);
        pC.fromBufferAttribute(pos, c);
        cb.subVectors(pC, pB);
        ab.subVectors(pA, pB);
        cb.cross(ab).normalize();
        fnorms[i3] = cb.x;
        fnorms[i3 + 1] = cb.y;
        fnorms[i3 + 2] = cb.z;
      }

      // Build unique edge map
      const edgeMap = new Map();
      for (let i = 0; i < numFaces; i++) {
        const i3 = i * 3;
        const a = index.getX(i3), b = index.getX(i3 + 1), c = index.getX(i3 + 2);
        const edges = [[a, b], [b, c], [c, a]];
        for (const [v1, v2] of edges) {
          const key = v1 < v2 ? `${v1}_${v2}` : `${v2}_${v1}`;
          let e = edgeMap.get(key);
          if (!e) {
            edgeMap.set(key, { v1: Math.min(v1, v2), v2: Math.max(v1, v2), f1: i, f2: -1 });
          } else {
            e.f2 = i;
          }
        }
      }

      const linePositions = [];
      const brainCenter = new THREE.Vector3(0, 0.4, 0);
      const midpoint = new THREE.Vector3();
      const radial = new THREE.Vector3();
      const norm1 = new THREE.Vector3(), norm2 = new THREE.Vector3();

      for (const e of edgeMap.values()) {
        if (e.f2 !== -1) {
          // Manifold edge: keep deep primary sulci creases
          norm1.set(fnorms[e.f1 * 3], fnorms[e.f1 * 3 + 1], fnorms[e.f1 * 3 + 2]);
          norm2.set(fnorms[e.f2 * 3], fnorms[e.f2 * 3 + 1], fnorms[e.f2 * 3 + 2]);
          if (norm1.dot(norm2) <= cosThreshold) {
            pA.fromBufferAttribute(pos, e.v1);
            pB.fromBufferAttribute(pos, e.v2);
            linePositions.push(pA.x, pA.y, pA.z, pB.x, pB.y, pB.z);
          }
        } else {
          // Boundary edge: only include outward-facing outer perimeter contours;
          // discard the hundreds of internal flat slice cuts that run through the inside of the brain
          pA.fromBufferAttribute(pos, e.v1);
          pB.fromBufferAttribute(pos, e.v2);
          midpoint.addVectors(pA, pB).multiplyScalar(0.5);
          radial.subVectors(midpoint, brainCenter).normalize();
          norm1.set(fnorms[e.f1 * 3], fnorms[e.f1 * 3 + 1], fnorms[e.f1 * 3 + 2]);
          if (radial.dot(norm1) > 0.4) {
            linePositions.push(pA.x, pA.y, pA.z, pB.x, pB.y, pB.z);
          }
        }
      }

      const edgeGeo = new THREE.BufferGeometry();
      edgeGeo.setAttribute("position", new THREE.Float32BufferAttribute(linePositions, 3));
      return edgeGeo;
    }

    function sampleSurfacePoints(geo, cellSize = 0.055) {
      const pos = geo && geo.attributes && geo.attributes.position;
      if (!pos) return new Float32Array(0);
      const invCell = 1.0 / cellSize;
      const seen = new Set();
      const pts = [];
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
        const ix = Math.round(x * invCell);
        const iy = Math.round(y * invCell);
        const iz = Math.round(z * invCell);
        const key = `${ix}_${iy}_${iz}`;
        if (!seen.has(key)) {
          seen.add(key);
          pts.push(x, y, z);
        }
      }
      return new Float32Array(pts);
    }

    function computeCrownInterpolationWeights(crownMesh, neighborMeshes) {
      const geo = crownMesh && crownMesh.geometry;
      const pos = geo && geo.attributes && geo.attributes.position;
      if (!pos || !neighborMeshes || neighborMeshes.length !== 4) return;

      const neighborPts = neighborMeshes.map(m => sampleSurfacePoints(m && m.geometry, 0.055));
      const weights = new Float32Array(pos.count * 4);
      const eps = 0.04;
      const power = 2.5;
      const wTmp = [0, 0, 0, 0];

      for (let v = 0; v < pos.count; v++) {
        const vx = pos.getX(v), vy = pos.getY(v), vz = pos.getZ(v);
        let wSum = 0.0;
        for (let k = 0; k < 4; k++) {
          const nArr = neighborPts[k];
          let minSq = Infinity;
          for (let j = 0; j < nArr.length; j += 3) {
            const dx = vx - nArr[j];
            const dy = vy - nArr[j + 1];
            const dz = vz - nArr[j + 2];
            const dSq = dx * dx + dy * dy + dz * dz;
            if (dSq < minSq) minSq = dSq;
          }
          const d = Math.sqrt(minSq);
          const wk = 1.0 / Math.pow(d + eps, power);
          wTmp[k] = wk;
          wSum += wk;
        }
        const inv = wSum > 1e-8 ? (1.0 / wSum) : 0.25;
        const base = v * 4;
        weights[base]     = wTmp[0] * inv;
        weights[base + 1] = wTmp[1] * inv;
        weights[base + 2] = wTmp[2] * inv;
        weights[base + 3] = wTmp[3] * inv;
      }

      geo.setAttribute("regionWeights", new THREE.BufferAttribute(weights, 4));
    }

    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.load(
      "brain_lobes.glb?v=4",
      (gltf) => {
        const initialOutlineOpacity = parseFloat(document.getElementById("outlineSlider").value) || 0.3;

        gltf.scene.traverse((child) => {
          if (!child.isMesh) return;
          const key = child.name;
          const geo = child.geometry;
          geo.computeVertexNormals();
          geo.computeBoundingSphere();

          if (LOBE_CONFIG[key]) {
            const conf = LOBE_CONFIG[key];
            const centroid = geo.boundingSphere
              ? geo.boundingSphere.center.clone()
              : new THREE.Vector3(...conf.center);

            // 1. Volumetric Matter Material (Blinn-Phong + Fresnel rim shader avoids heavy PBR BRDF cost
            //    while keeping identical sculpted highlights and neon glow at native resolution)
            const mat = new THREE.MeshPhongMaterial({
              color: INACTIVE_COLOR,
              emissive: new THREE.Color(0x000000),
              emissiveIntensity: 0.0,
              specular: 0x334155,
              shininess: 38,
              transparent: true,
              opacity: 0.10,
              depthWrite: false,
            });

            let interpUniforms = null;
            if (conf.interpolatedFrom) {
              interpUniforms = {
                uNeighborColor0: { value: new THREE.Color(0x38bdf8) },
                uNeighborColor1: { value: new THREE.Color(0x38bdf8) },
                uNeighborColor2: { value: new THREE.Color(0x38bdf8) },
                uNeighborColor3: { value: new THREE.Color(0x38bdf8) },
                uNeighborActs:   { value: new THREE.Vector4(0, 0, 0, 0) },
                uInactiveColor:  { value: INACTIVE_COLOR_OBJ },
              };
              mat.customProgramCacheKey = () => "parietal_interp_v1";
              mat.onBeforeCompile = (shader) => {
                Object.assign(shader.uniforms, interpUniforms);
                shader.vertexShader = shader.vertexShader
                  .replace(
                    "#include <common>",
                    `#include <common>
                    attribute vec4 regionWeights;
                    varying vec4 vRegionWeights;`
                  )
                  .replace(
                    "#include <begin_vertex>",
                    `#include <begin_vertex>
                    vRegionWeights = regionWeights;`
                  );
                shader.fragmentShader = shader.fragmentShader
                  .replace(
                    "#include <common>",
                    `#include <common>
                    varying vec4 vRegionWeights;
                    uniform vec3 uNeighborColor0;
                    uniform vec3 uNeighborColor1;
                    uniform vec3 uNeighborColor2;
                    uniform vec3 uNeighborColor3;
                    uniform vec4 uNeighborActs;
                    uniform vec3 uInactiveColor;`
                  )
                  .replace(
                    "vec4 diffuseColor = vec4( diffuse, opacity );",
                    `
                    vec4 rw = max(vRegionWeights, vec4(0.0));
                    float rwSum = dot(rw, vec4(1.0));
                    rw = rwSum > 1e-5 ? rw / rwSum : vec4(0.25);
                    float interpAct = clamp(dot(rw, uNeighborActs), 0.0, 1.0);
                    vec4 colorWeights = rw * (vec4(0.12) + uNeighborActs);
                    float cwSum = dot(colorWeights, vec4(1.0));
                    vec3 interpColor = (
                      uNeighborColor0 * colorWeights.x +
                      uNeighborColor1 * colorWeights.y +
                      uNeighborColor2 * colorWeights.z +
                      uNeighborColor3 * colorWeights.w
                    ) / max(cwSum, 1e-4);
                    float interpGlow = pow(max(interpAct, 0.0), 1.35);
                    float interpDensity = pow(max(interpAct, 0.0), 0.6);
                    float interpOpacity = 0.14 + interpDensity * 0.72;
                    vec3 interpDiffuse = mix(uInactiveColor, interpColor, 0.15 + interpAct * 0.85);
                    vec4 diffuseColor = vec4( interpDiffuse, interpOpacity );
                    `
                  )
                  .replace(
                    "vec3 totalEmissiveRadiance = emissive;",
                    `
                    // Preserve lit surface shading while giving interpolated crown contours a seamless Fresnel rim glow
                    float viewDot = abs(dot(normalize(vNormal), normalize(vViewPosition)));
                    float fresnel = pow(1.0 - viewDot, 2.2);
                    float matterRim = 0.50 + 0.35 * viewDot + 0.65 * fresnel;
                    vec3 interpEmissive = interpColor * (interpAct * 0.35 + interpGlow * 1.45);
                    vec3 totalEmissiveRadiance = interpEmissive * matterRim;
                    `
                  );
              };
            } else {
              mat.customProgramCacheKey = () => "active_lobe_rim_v1";
              mat.onBeforeCompile = (shader) => {
                shader.fragmentShader = shader.fragmentShader.replace(
                  "vec3 totalEmissiveRadiance = emissive;",
                  `
                  // Preserve lit surface shading while giving active lobe contours a subtle Fresnel rim glow
                  float viewDot = abs(dot(normalize(vNormal), normalize(vViewPosition)));
                  float fresnel = pow(1.0 - viewDot, 2.2);
                  float matterRim = 0.50 + 0.35 * viewDot + 0.65 * fresnel;
                  vec3 totalEmissiveRadiance = emissive * matterRim;
                  `
                );
              };
            }

            const mesh = new THREE.Mesh(geo, mat);
            mesh.userData = {
              regionKey: key,
              config: conf,
              centroid: centroid,
              currentAct: 0.0,
              targetAct: 0.0,
              currentColor: new THREE.Color(0x38bdf8),
              targetColor: new THREE.Color(0x38bdf8),
              colorInitialized: false,
              interpUniforms: interpUniforms,
            };

            // 2. Sharp, clean main outlines only (primary sulci fissures & outer contours)
            const edgeGeo = createMainEdgesGeometry(geo, 36);
            const edgeMat = new THREE.LineBasicMaterial({
              color: new THREE.Color(INACTIVE_EDGE),
              transparent: true,
              opacity: initialOutlineOpacity,
              depthWrite: false,
            });
            const edgeLines = new THREE.LineSegments(edgeGeo, edgeMat);
            mesh.add(edgeLines);

            brainGroup.add(mesh);
            lobeMeshes[key] = mesh;
            lobeEdges[key] = edgeLines;
          } else if (key === "cerebellum" || key === "brainstem") {
            // Anatomical Cerebellum & Brainstem Base (cheap Lambert + sparser contours for 32k polys)
            const baseMat = new THREE.MeshLambertMaterial({
              color: 0x0b1628,
              transparent: true,
              opacity: 0.10,
              depthWrite: false,
            });
            const baseMesh = new THREE.Mesh(geo, baseMat);
            baseMesh.renderOrder = 2;

            const baseEdgeGeo = new THREE.EdgesGeometry(geo, 42);
            const baseEdgeMat = new THREE.LineBasicMaterial({
              color: new THREE.Color(INACTIVE_EDGE),
              transparent: true,
              opacity: initialOutlineOpacity * 0.65,
              depthWrite: false,
            });
            const baseEdgeLines = new THREE.LineSegments(baseEdgeGeo, baseEdgeMat);
            baseEdgeLines.renderOrder = 2;
            baseMesh.add(baseEdgeLines);
            noncorticalEdges.push(baseEdgeLines);

            brainGroup.add(baseMesh);
          } else if (key === "cortex_core") {
            // Dark matte inner core acting as a depth occluder so far-side lobes don't bleed through
            const coreGeo = decimateGeometryByGrid(geo, 18, 4500) || geo;
            const coreMat = new THREE.MeshBasicMaterial({
              color: 0x040812,
              transparent: false,
              depthWrite: true,
            });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            coreMesh.renderOrder = 1;
            brainGroup.add(coreMesh);
          }
        });

        lobeKeys = Object.keys(lobeMeshes);
        lobeMeshList = Object.values(lobeMeshes);
        for (const key of lobeKeys) {
          const conf = LOBE_CONFIG[key];
          if (conf && conf.interpolatedFrom) {
            const neighbors = conf.interpolatedFrom.map(nKey => lobeMeshes[nKey]);
            computeCrownInterpolationWeights(lobeMeshes[key], neighbors);
          }
        }
        needsRenderOrderSort = true;

        // Center the brain model vertically so its center sits at the screen center (0, 0, 0)
        const brainBox = new THREE.Box3().setFromObject(brainGroup);
        const yOffset = !brainBox.isEmpty() ? brainBox.getCenter(new THREE.Vector3()).y : 0;
        if (yOffset !== 0) {
          brainGroup.position.y -= yOffset;
        }
        brainGroup.updateMatrixWorld(true);
        const centeredBox = new THREE.Box3().setFromObject(brainGroup);
        if (!centeredBox.isEmpty()) {
          const bSize = centeredBox.getSize(new THREE.Vector3());
          brainHalfWidthWorld = Math.max(0.5, Math.max(bSize.x, bSize.z) * 0.5);
        }
        for (const mesh of lobeMeshList) {
          if (yOffset !== 0) {
            mesh.userData.centroid.y += brainGroup.position.y;
          }
          mesh.userData.worldBox = new THREE.Box3().setFromObject(mesh);
          mesh.userData.raycastProxy = createRaycastProxyMesh(mesh);
        }
        if (typeof updateNarrowMode === "function") {
          updateNarrowMode();
        }

        if (currentEEGData) {
          onBrainDataReceived(currentEEGData);
        }
      },
      undefined,
      (err) => {
        console.error("Failed to load /brain_lobes.glb:", err);
      }
    );


    // -------------------------------------------------------------------------
    // Real-Time Server-Sent Events (SSE) Stream Handling
    // -------------------------------------------------------------------------
    let sseSource = null;
    let pendingSSEData = null;
    let frameCounter = 0;
    let lastFpsTime = performance.now();
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const fpsCounter = document.getElementById("fpsCounter");

    // Where the data comes from: this page's own server (standalone), or -- when the page is served under
    // /studio/ by the logger's web server -- the LSL backend on STUDIO_PORT of the same host.
    // ?device=ID chooses the EEG device (the logger's ids: epocx1, epocx2, muse1).
    const STUDIO_PORT = 8766;
    const UNDER_LOGGER = location.pathname.startsWith("/studio/");
    const API = UNDER_LOGGER ? `${location.protocol}//${location.hostname}:${STUDIO_PORT}` : "";
    let deviceId = new URLSearchParams(location.search).get("device") || "";
    const devQ = () => (deviceId ? `?device=${encodeURIComponent(deviceId)}` : "");

    let gotDevices = false;
    let loggerPort = null;   // the backend may name a web app on this host to link back to
    async function initDevices() {
      try {
        const r = await fetch(API + "/api/devices");
        if (!r.ok) throw new Error("no device list");
        const j = await r.json();
        gotDevices = true;
        loggerPort = j.logger_port || null;
        document.body.classList.toggle("live-only", !!j.live_only);
        const ids = j.devices.map(d => d.id);
        if (!ids.includes(deviceId)) deviceId = j.default;
        const sel = document.getElementById("deviceSel");
        const names = { epocx1: "EPOC X #1", epocx2: "EPOC X #2", muse1: "Muse" };
        sel.textContent = "";
        for (const d of j.devices) {
          const o = document.createElement("option");
          o.value = d.id;
          o.textContent = (names[d.id] || d.name) + (d.kind === "muse" ? " (4 electrodes)" : "");
          sel.appendChild(o);
        }
        sel.value = deviceId;
        sel.style.display = "";
        sel.addEventListener("change", () => {
          deviceId = sel.value;
          const u = new URL(location.href);
          u.searchParams.set("device", deviceId);
          history.replaceState(null, "", u);
          // a fresh view of the other device: forget the history of this one
          lastSessionId = null; lastGraphSampleKey = null;
          for (const b of BAND_KEYS) { if (bandHistory[b]) bandHistory[b].length = 0; }
          bandGraphsDirty = true;
          currentEEGData = null;
          headmapReset();
          connectSSE();
        });
      } catch (e) {
        // a plain single-stream server: nothing to choose
      }
      if (gotDevices && (loggerPort || UNDER_LOGGER)) {   // offer the way back to the app that links here
        const back = document.getElementById("backLink");
        back.href = loggerPort ? `${location.protocol}//${location.hostname}:${loggerPort}/` : "/";
        back.style.display = "";
      }
    }

    // Live head map: the image an external head map feeder keeps writing for this device, via the
    // backend (/api/headmap). Polled with ETag like the logger does; "NO SIGNAL" when it is missing or stale.
    const HEADMAP_STALE_S = 3;
    const headmap = { etag: null, url: null, lost: true, timer: null };
    function headmapReset() {
      headmap.etag = null;
      const img = document.getElementById("headmapImg");
      if (img.src.startsWith("blob:")) URL.revokeObjectURL(img.src);
      img.removeAttribute("src");
      document.getElementById("headmapBox").classList.add("lost");
      headmap.lost = true;
    }
    async function headmapTick() {
      const t0 = performance.now();
      if (document.body.classList.contains("live-only") && deviceId && !document.hidden) {
        const box = document.getElementById("headmapBox");
        const img = document.getElementById("headmapImg");
        const dev = deviceId;
        try {
          const r = await fetch(`${API}/api/headmap?device=${encodeURIComponent(dev)}`, { cache: "no-cache" });
          if (dev !== deviceId) return headmapSchedule(t0);   // device changed meanwhile
          if (r.ok) {
            const tag = r.headers.get("ETag") || r.headers.get("Last-Modified");
            if (tag === null || tag !== headmap.etag) {
              const blob = await r.blob();
              const old = img.src;
              img.src = URL.createObjectURL(blob);
              if (old.startsWith("blob:")) URL.revokeObjectURL(old);
              headmap.etag = tag;
            }
            const age = (Date.parse(r.headers.get("Date")) - Date.parse(r.headers.get("Last-Modified"))) / 1000;
            headmap.lost = !(age <= HEADMAP_STALE_S);
          } else {
            headmap.lost = true;
          }
        } catch (e) {
          headmap.lost = true;
        }
        box.classList.toggle("lost", headmap.lost);
      }
      headmapSchedule(t0);
    }
    function headmapSchedule(t0) {
      const period = document.body.classList.contains("narrow-mode") ? 500 : 250;
      headmap.timer = setTimeout(headmapTick, Math.max(0, period - (performance.now() - t0)));
    }
    headmapTick();

    function connectSSE() {
      if (sseSource) sseSource.close();

      sseSource = new EventSource(API + "/stream" + devQ());

      sseSource.onopen = () => {
        if (isStreamActive && !isPlaybackPaused) {
          setStatusIndicator("status-dot online", "STREAM ACTIVE");
        }
        fetch(API + "/api/status" + devQ())
          .then(r => r.json())
          .then(s => {
            if (s && typeof s.paused === "boolean") {
              updatePlaybackUI(s.paused, s.stream_active, s.stream_mode);
            }
          })
          .catch(() => {});
      };

      sseSource.addEventListener("status", (event) => {
        try {
          const s = JSON.parse(event.data);
          if (s && typeof s.paused === "boolean") {
            updatePlaybackUI(s.paused, s.stream_active, s.stream_mode);
          }
        } catch (e) {
          console.error("SSE status parse error", e);
        }
      });

      sseSource.onmessage = (event) => {
        try {
          pendingSSEData = JSON.parse(event.data);
          frameCounter++;
        } catch (e) {
          console.error("SSE parse error", e);
        }
      };

      sseSource.onerror = () => {
        setStatusIndicator("status-dot offline", "RECONNECTING...");
        // EventSource automatically retries
      };
    }

    initDevices().then(connectSSE);

    // FPS Meter
    setInterval(() => {
      const now = performance.now();
      const elapsed = (now - lastFpsTime) / 1000;
      const fps = Math.round(frameCounter / elapsed);
      fpsCounter.textContent = `${fps} FPS`;
      frameCounter = 0;
      lastFpsTime = now;
    }, 1000);

    // -------------------------------------------------------------------------
    // EEG Data Processor & Lobe Glow Modulation
    // -------------------------------------------------------------------------
    let isPlaybackPaused = false;
    let isStreamActive = true;
    let currentStreamMode = "live";
    let isScrubbing = false;
    let lastSeekFetchTime = 0;
    let seekSequence = 0;
    let seekPendingSince = 0;
    let lastKnownDuration = 0;
    let lastSampleCount = 0;
    let lastSessionId = 0;

    // Rolling Time-Series History for Expandable Wave Band Graphs
    const BAND_HISTORY_MAX = 120; // ~6 seconds at 20 FPS
    const BAND_KEYS = ["alpha", "beta", "theta", "gamma", "delta"];
    const BAND_HEX_CSS = {
      alpha: "#a855f7",
      beta:  "#22c55e",
      theta: "#facc15",
      gamma: "#ec4899",
      delta: "#ef4444"
    };
    const BAND_RGB = {
      alpha: [168, 85, 247],
      beta:  [34, 197, 94],
      theta: [250, 204, 21],
      gamma: [236, 72, 153],
      delta: [239, 68, 68]
    };
    const bandHistory = {
      alpha: [],
      beta:  [],
      theta: [],
      gamma: [],
      delta: []
    };
    let lastGraphSampleKey = null;
    let lastGlobalDominant = "alpha";

    // Track active/disabled state for each individual frequency band
    const bandEnabledState = {
      alpha: true,
      beta:  true,
      theta: true,
      gamma: true,
      delta: true
    };

    function isBandEnabled(band) {
      if (!band || band === "all") return true;
      return bandEnabledState[band] !== false;
    }

    function setBandEnabled(band, enabled) {
      if (band === "all" || !BAND_KEYS.includes(band)) return;
      bandEnabledState[band] = !!enabled;

      const btn = document.querySelector(`.band-btn[data-band="${band}"]`);
      if (btn) {
        const swatch = btn.querySelector(".band-swatch");
        if (!bandEnabledState[band]) {
          // Disable band: go to greyscale
          btn.classList.add("band-disabled");
          if (swatch) {
            swatch.title = `Enable ${band.toUpperCase()} band`;
            swatch.setAttribute("aria-label", `Enable ${band} band`);
          }
          // If this band was selected, switch back to "All Bands"
          if (selectedBandMode === band) {
            document.querySelectorAll(".band-btn").forEach(b => {
              b.classList.remove("active");
              b.classList.remove("expanded");
            });
            const allBtn = document.querySelector('.band-btn[data-band="all"]');
            if (allBtn) {
              allBtn.classList.add("active");
              allBtn.classList.add("expanded");
            }
            selectedBandMode = "all";
          } else {
            btn.classList.remove("expanded");
          }
        } else {
          // Enable band
          btn.classList.remove("band-disabled");
          if (swatch) {
            swatch.title = `Disable ${band.toUpperCase()} band`;
            swatch.setAttribute("aria-label", `Disable ${band} band`);
          }
        }
      }

      if (currentEEGData) {
        onBrainDataReceived(currentEEGData);
      }
      renderAllBandGraphs(true);
    }

    const SVG_NS = "http://www.w3.org/2000/svg";
    const SVG_W = 210;
    const SVG_H = 54;
    const SVG_PAD_L = 2;
    const SVG_PAD_R = 5;
    const SVG_PAD_T = 5;
    const SVG_PAD_B = 4;
    const SVG_PLOT_W = SVG_W - SVG_PAD_L - SVG_PAD_R;
    const SVG_PLOT_H = SVG_H - SVG_PAD_T - SVG_PAD_B;
    const GRAPH_MAX_SAMPLE_PTS = 60;
    const GRAPH_RENDER_INTERVAL_MS = 85;

    let bandGraphsDirty = true;
    let lastGraphRenderMs = 0;
    const bandSvgs = Array.from(document.querySelectorAll(".band-svg"));
    const sidebarHudEl = document.querySelector(".sidebar.hud");

    function createSvgEl(tag, attrs) {
      const el = document.createElementNS(SVG_NS, tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    }

    function initBandSvgChart(svgEl) {
      if (svgEl._chartRefs) return svgEl._chartRefs;
      const chartBand = svgEl.dataset.svgBand;
      const defs = createSvgEl("defs", {});
      svgEl.appendChild(defs);

      // Static background grid (created once, never redrawn)
      const gridGroup = createSvgEl("g", {
        stroke: "rgba(56, 189, 248, 0.09)",
        "stroke-width": "1",
        fill: "none",
      });
      for (const frac of [0.25, 0.5, 0.75]) {
        const y = (SVG_PAD_T + SVG_PLOT_H * frac).toFixed(1);
        gridGroup.appendChild(createSvgEl("line", { x1: "0", y1: y, x2: String(SVG_W), y2: y }));
      }
      for (let i = 1; i < 4; i++) {
        const x = ((SVG_W * i) / 4).toFixed(1);
        gridGroup.appendChild(createSvgEl("line", { x1: x, y1: "0", x2: x, y2: String(SVG_H) }));
      }
      svgEl.appendChild(gridGroup);

      const scaleLabel = createSvgEl("text", {
        x: "3",
        y: "9",
        fill: "rgba(100, 116, 139, 0.65)",
        "font-size": "8",
        "font-family": "monospace",
      });
      scaleLabel.textContent = "50%";
      svgEl.appendChild(scaleLabel);

      const seriesKeys = chartBand === "all" ? BAND_KEYS : [chartBand];
      const seriesMap = {};
      for (const b of seriesKeys) {
        const hex = BAND_HEX_CSS[b] || "#38bdf8";
        const rgb = BAND_RGB[b] || [56, 189, 248];
        const gradId = `bandGrad_${chartBand}_${b}`;
        const grad = createSvgEl("linearGradient", { id: gradId, x1: "0", y1: "0", x2: "0", y2: "1" });
        grad.appendChild(createSvgEl("stop", { offset: "0%", "stop-color": hex, "stop-opacity": chartBand === "all" ? "0.16" : "0.30" }));
        grad.appendChild(createSvgEl("stop", { offset: "100%", "stop-color": hex, "stop-opacity": "0" }));
        defs.appendChild(grad);

        const g = createSvgEl("g", { display: "none" });
        const area = createSvgEl("polygon", { fill: `url(#${gradId})`, points: "" });
        const halo = createSvgEl("polyline", {
          fill: "none",
          stroke: `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0.26)`,
          "stroke-width": "4.2",
          "stroke-linecap": "round",
          "stroke-linejoin": "round",
          points: "",
        });
        const line = createSvgEl("polyline", {
          fill: "none",
          stroke: hex,
          "stroke-width": "1.8",
          "stroke-linecap": "round",
          "stroke-linejoin": "round",
          points: "",
        });
        const dotHalo = createSvgEl("circle", {
          r: "4.2",
          fill: `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, 0.28)`,
        });
        const dotCore = createSvgEl("circle", {
          r: "2.3",
          fill: "#f8fafc",
          stroke: hex,
          "stroke-width": "1.3",
        });
        g.appendChild(area);
        g.appendChild(halo);
        g.appendChild(line);
        g.appendChild(dotHalo);
        g.appendChild(dotCore);
        svgEl.appendChild(g);
        seriesMap[b] = { g, area, halo, line, dotHalo, dotCore, lastLineW: "" };
      }

      svgEl._chartRefs = {
        btn: svgEl.closest(".band-btn"),
        band: chartBand,
        scaleLabel,
        lastScaleText: "50%",
        lastDomKey: null,
        seriesMap,
      };
      return svgEl._chartRefs;
    }

    function updateSvgBandSeries(seriesRef, points, maxScale, showArea, lineWidth) {
      const n = points ? points.length : 0;
      if (n === 0) {
        seriesRef.g.setAttribute("display", "none");
        return;
      }
      seriesRef.g.removeAttribute("display");

      const baseY = (SVG_PAD_T + SVG_PLOT_H).toFixed(1);
      const step = n > GRAPH_MAX_SAMPLE_PTS ? (n - 1) / (GRAPH_MAX_SAMPLE_PTS - 1) : 1;
      const denom = Math.max(1, BAND_HISTORY_MAX - 1);
      let linePts = "";
      let firstX = "";
      let lastX = "";
      let lastY = "";

      for (let s = 0; ; s++) {
        const idx = step === 1 ? s : (s >= GRAPH_MAX_SAMPLE_PTS - 1 ? n - 1 : Math.round(s * step));
        const offsetIdx = BAND_HISTORY_MAX - n + idx;
        const x = (SVG_PAD_L + (offsetIdx / denom) * SVG_PLOT_W).toFixed(1);
        const norm = Math.min(1, Math.max(0, points[idx] / maxScale));
        const y = (SVG_PAD_T + SVG_PLOT_H * (1 - norm)).toFixed(1);
        const pair = x + "," + y;
        linePts += (s === 0 ? pair : " " + pair);
        if (s === 0) firstX = x;
        lastX = x;
        lastY = y;
        if (idx >= n - 1) break;
      }

      seriesRef.line.setAttribute("points", linePts);
      seriesRef.halo.setAttribute("points", linePts);
      const lwStr = String(lineWidth);
      if (seriesRef.lastLineW !== lwStr) {
        seriesRef.lastLineW = lwStr;
        seriesRef.line.setAttribute("stroke-width", lwStr);
        seriesRef.halo.setAttribute("stroke-width", (lineWidth + 2.8).toFixed(1));
      }

      if (showArea && n >= 2) {
        seriesRef.area.setAttribute("points", `${firstX},${baseY} ${linePts} ${lastX},${baseY}`);
        seriesRef.area.removeAttribute("display");
      } else {
        seriesRef.area.setAttribute("display", "none");
      }

      seriesRef.dotHalo.setAttribute("cx", lastX);
      seriesRef.dotHalo.setAttribute("cy", lastY);
      seriesRef.dotCore.setAttribute("cx", lastX);
      seriesRef.dotCore.setAttribute("cy", lastY);
    }

    for (let i = 0; i < bandSvgs.length; i++) {
      initBandSvgChart(bandSvgs[i]);
    }

    function renderAllBandGraphs(force = false) {
      const isHidden = document.body.classList.contains("fullscreen-mode") || document.body.classList.contains("narrow-mode");
      if (!force && isHidden && sidebarHudEl && !sidebarHudEl.classList.contains("revealed")) {
        return;
      }
      bandGraphsDirty = false;
      lastGraphRenderMs = performance.now();

      for (let cIdx = 0; cIdx < bandSvgs.length; cIdx++) {
        const svgEl = bandSvgs[cIdx];
        const refs = initBandSvgChart(svgEl);
        if (refs.btn && !refs.btn.classList.contains("expanded")) continue;

        const band = refs.band;
        if (band === "all") {
          const enabledBands = BAND_KEYS.filter(b => isBandEnabled(b));
          let maxVal = 0.45;
          for (const b of enabledBands) {
            const arr = bandHistory[b];
            for (let i = 0; i < arr.length; i++) {
              if (arr[i] > maxVal) maxVal = arr[i];
            }
          }
          const maxScale = Math.min(1.0, Math.max(0.50, maxVal * 1.15));
          const scaleTxt = Math.round(maxScale * 100) + "%";
          if (refs.lastScaleText !== scaleTxt) {
            refs.lastScaleText = scaleTxt;
            refs.scaleLabel.textContent = scaleTxt;
          }

          for (const b of BAND_KEYS) {
            if (!enabledBands.includes(b)) {
              refs.seriesMap[b].g.setAttribute("display", "none");
            }
          }

          const domBand = (lastGlobalDominant && enabledBands.includes(lastGlobalDominant)) ? lastGlobalDominant : null;
          if (domBand && refs.lastDomKey !== domBand) {
            refs.lastDomKey = domBand;
            svgEl.appendChild(refs.seriesMap[domBand].g);
          }

          for (const b of enabledBands) {
            const isDom = b === domBand;
            updateSvgBandSeries(refs.seriesMap[b], bandHistory[b], maxScale, isDom, isDom ? 1.9 : 1.35);
          }
        } else if (bandHistory[band]) {
          const arr = bandHistory[band];
          let maxVal = 0.42;
          for (let i = 0; i < arr.length; i++) {
            if (arr[i] > maxVal) maxVal = arr[i];
          }
          const maxScale = Math.min(1.0, Math.max(0.50, maxVal * 1.18));
          const scaleTxt = Math.round(maxScale * 100) + "%";
          if (refs.lastScaleText !== scaleTxt) {
            refs.lastScaleText = scaleTxt;
            refs.scaleLabel.textContent = scaleTxt;
          }
          updateSvgBandSeries(refs.seriesMap[band], arr, maxScale, true, 1.85);
        }
      }
    }

    // Cached HUD DOM references & zero-layout progress bar updates
    const domCache = {
      btnPause: document.getElementById("btnPause"),
      progBar: document.getElementById("playbackProgressBar"),
      progFill: document.getElementById("playbackProgress"),
      progThumb: document.getElementById("playbackProgressThumb"),
      playbackModeLabel: document.getElementById("playbackModeLabel"),
      playbackTs: document.getElementById("playbackTimestamp"),
      playbackElapsed: document.getElementById("playbackElapsed"),
      metricAlphaProm: document.getElementById("metricAlphaProm"),
      metricEngagement: document.getElementById("metricEngagement"),
      btnCalibrate: document.getElementById("btnCalibrate"),
      bandVals: {
        alpha: document.getElementById("valAlpha"),
        beta:  document.getElementById("valBeta"),
        theta: document.getElementById("valTheta"),
        gamma: document.getElementById("valGamma"),
        delta: document.getElementById("valDelta"),
      },
      barWidth: 0,
      lastRatio: 0,
      lastValues: {},
    };

    function setCachedText(el, key, value) {
      if (el && domCache.lastValues[key] !== value) {
        domCache.lastValues[key] = value;
        el.textContent = value;
      }
    }

    function invalidateHudMetrics() {
      domCache.barWidth = domCache.progBar ? domCache.progBar.clientWidth : 0;
      setPlaybackBarRatio(domCache.lastRatio);
    }

    function setPlaybackBarRatio(ratio) {
      const clamped = Math.min(1, Math.max(0, isFinite(ratio) ? ratio : 0));
      domCache.lastRatio = clamped;
      if (domCache.progFill) {
        const sx = clamped.toFixed(4);
        if (domCache.lastValues._scaleX !== sx) {
          domCache.lastValues._scaleX = sx;
          domCache.progFill.style.transform = `scaleX(${sx})`;
        }
      }
      if (domCache.progThumb) {
        if (!domCache.barWidth && domCache.progBar) {
          domCache.barWidth = domCache.progBar.clientWidth;
        }
        const xPx = (clamped * domCache.barWidth).toFixed(1) + "px";
        if (domCache.lastValues._thumbX !== xPx) {
          domCache.lastValues._thumbX = xPx;
          domCache.progThumb.style.setProperty("--thumb-x", xPx);
        }
      }
    }

    function setStatusIndicator(cls, text) {
      if (domCache.lastValues._statusCls !== cls) {
        domCache.lastValues._statusCls = cls;
        statusDot.className = cls;
      }
      setCachedText(statusText, "_statusTxt", text);
    }

    function formatClockSec(sec) {
      if (sec === undefined || sec === null || !isFinite(sec)) return "00:00.0";
      const s = Math.max(0, sec);
      const mins = Math.floor(s / 60);
      const rem = (s % 60).toFixed(1).padStart(4, "0");
      return String(mins).padStart(2, "0") + ":" + rem;
    }

    function updatePlaybackUI(paused, streamActive, streamMode) {
      if (typeof streamActive === "boolean") {
        isStreamActive = streamActive;
      }
      if (typeof streamMode === "string" && streamMode) {
        currentStreamMode = streamMode;
      }
      isPlaybackPaused = isStreamActive ? !!paused : false;
      const transportState = !isStreamActive ? "idle" : (isPlaybackPaused ? "paused" : "playing");
      const btnPause = domCache.btnPause;
      const progFill = domCache.progFill;
      const progThumb = domCache.progThumb;
      if (btnPause && domCache.lastValues._transportState !== transportState) {
        domCache.lastValues._transportState = transportState;
        if (transportState === "idle") {
          btnPause.textContent = "▶ Play Recording";
          btnPause.classList.add("idle");
          btnPause.classList.remove("paused");
        } else if (transportState === "paused") {
          btnPause.textContent = "▶ Resume Recording";
          btnPause.classList.remove("idle");
          btnPause.classList.add("paused");
        } else {
          btnPause.textContent = "⏸ Pause Recording";
          btnPause.classList.remove("idle");
          btnPause.classList.remove("paused");
        }
      }
      const barColor = transportState === "idle" ? "#64748b" : (transportState === "paused" ? "#eab308" : "var(--accent)");
      if (progFill && domCache.lastValues._fillState !== transportState) {
        domCache.lastValues._fillState = transportState;
        progFill.style.backgroundColor = barColor;
      }
      if (progThumb && domCache.lastValues._thumbState !== transportState) {
        domCache.lastValues._thumbState = transportState;
        progThumb.style.borderColor = barColor;
      }
      const activeModeText = (currentStreamMode === "replay" || (currentEEGData && currentEEGData.is_replay)) ? "REPLAY" : "LIVE";
      const modeLabel = !isStreamActive ? "IDLE" : (isPlaybackPaused ? "PAUSED" : activeModeText);
      setCachedText(domCache.playbackModeLabel, "modeLabel", modeLabel);
      if (!isStreamActive) {
        setStatusIndicator("status-dot idle", "IDLE — READY");
      } else if (isPlaybackPaused) {
        setStatusIndicator("status-dot paused", "PAUSED");
      } else if (currentEEGData && currentEEGData.artifact) {
        setStatusIndicator("status-dot artifact", "EMG ARTIFACT CLAMPED");
      } else if (sseSource && sseSource.readyState === EventSource.OPEN) {
        setStatusIndicator("status-dot online", "STREAM ACTIVE");
      }
    }

    function updatePauseUI(paused) {
      updatePlaybackUI(paused, isStreamActive, currentStreamMode);
    }

    function togglePause() {
      const payload = !isStreamActive
        ? { action: "start", paused: false }
        : { paused: !isPlaybackPaused };
      if (isStreamActive) {
        updatePlaybackUI(!isPlaybackPaused, isStreamActive, currentStreamMode);
      }
      fetch(API + "/api/pause" + devQ(), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
        .then(r => r.json())
        .then(res => {
          if (res && typeof res.paused === "boolean") {
            updatePlaybackUI(res.paused, res.stream_active, res.stream_mode);
          }
        })
        .catch(err => console.error("Pause toggle error", err));
    }

    function onBrainDataReceived(data) {
      currentEEGData = data;

      // 0. Timestamp & Playback Progress Update
      const nextSessionId = typeof data.session_id === "number" ? data.session_id : lastSessionId;
      const nextSampleCount = typeof data.sample_count === "number" ? data.sample_count : lastSampleCount;
      if (nextSessionId !== lastSessionId || nextSampleCount < lastSampleCount) {
        lastSessionId = nextSessionId;
        lastGraphSampleKey = null;
        lastKnownDuration = 0;
        for (const b of BAND_KEYS) {
          if (bandHistory[b]) bandHistory[b].length = 0;
        }
        bandGraphsDirty = true;
      }
      lastSampleCount = nextSampleCount;

      const nextActive = typeof data.stream_active === "boolean" ? data.stream_active : isStreamActive;
      const nextMode = (typeof data.stream_mode === "string" && data.stream_mode)
        ? data.stream_mode
        : (data.is_replay ? "replay" : "live");
      const nextPaused = typeof data.paused === "boolean" ? data.paused : isPlaybackPaused;
      if (nextPaused !== isPlaybackPaused || nextActive !== isStreamActive || nextMode !== currentStreamMode) {
        updatePlaybackUI(nextPaused, nextActive, nextMode);
      }
      const activeModeText = (currentStreamMode === "replay" || data.is_replay) ? "REPLAY" : "LIVE";
      setCachedText(
        domCache.playbackModeLabel,
        "modeLabel",
        !isStreamActive ? "IDLE" : (isPlaybackPaused ? "PAUSED" : activeModeText)
      );

      const tsIso = data.timestamp_iso || (data.timestamp ? new Date(data.timestamp * 1000).toISOString().replace("T", " ").slice(0, 23) : "--:--:--.---");
      setCachedText(domCache.playbackTs, "playbackTs", tsIso);

      const elapsedStr = formatClockSec(data.elapsed_sec || 0);
      const isSeekInFlight = seekPendingSince > 0 && (performance.now() - seekPendingSince) < 1500;
      if (data.duration_sec && data.duration_sec > 0) {
        lastKnownDuration = data.duration_sec;
        const canSeek = data.can_seek !== false;
        const thumbVis = canSeek ? "block" : "none";
        if (domCache.progThumb && domCache.lastValues._thumbVis !== thumbVis) {
          domCache.lastValues._thumbVis = thumbVis;
          domCache.progThumb.style.display = thumbVis;
          if (canSeek && !domCache.barWidth && domCache.progBar) domCache.barWidth = domCache.progBar.clientWidth;
        }
        if (domCache.progBar) {
          const cursorStyle = canSeek ? "pointer" : "default";
          if (domCache.lastValues._progCursor !== cursorStyle) {
            domCache.lastValues._progCursor = cursorStyle;
            domCache.progBar.style.cursor = cursorStyle;
          }
        }
        if (!isScrubbing && !isSeekInFlight) {
          const durStr = formatClockSec(data.duration_sec);
          setCachedText(domCache.playbackElapsed, "elapsed", `${elapsedStr} / ${durStr}`);
          setPlaybackBarRatio(data.elapsed_sec / data.duration_sec);
        }
      } else {
        lastKnownDuration = 0;
        if (domCache.progThumb && domCache.lastValues._thumbVis !== "none") {
          domCache.lastValues._thumbVis = "none";
          domCache.progThumb.style.display = "none";
        }
        if (domCache.progBar && domCache.lastValues._progCursor !== "default") {
          domCache.lastValues._progCursor = "default";
