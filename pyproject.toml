[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epoc-x-studio"
version = "1.0.0"
description = "EPOC-X Studio: unified Emotiv EPOC-X EEG acquisition, live waveforms, headmap, 3D brain map, and CSV compare desktop app"
readme = "README.md"
authors = [
    { name = "Michal Novák" },
    { name = "Ondřej Bojar" },
]
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.21",
    "cryptography>=41",
    "numpy>=1.24",
    "PyQt6>=6.6",
    "PyQt6-WebEngine>=6.6",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
lsl = ["pylsl>=1.16"]

[project.scripts]
epoc-direct-record = "epoc_direct.record_cli:main"
epoc-headmap = "epoc_studio.headmap_view:main"
epoc-live-viewer = "epoc_studio.live_viewer_view:main"
epoc-brain-map = "epoc_studio.brain_map_view:main"
epoc-csv-compare = "epoc_studio.csv_compare_view:main"
epoc-take-notes = "epoc_direct.notes_cli:main"
epoc-probe-device = "epoc_direct.probe_cli:main"
epoc-save-lsl = "epoc_direct.lsl_cli:save_lsl_main"
epoc-from-lsl = "epoc_direct.lsl_cli:from_lsl_main"

[project.gui-scripts]
epoc-studio = "epoc_studio.launcher:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["epoc_direct*", "epoc_studio*"]

[tool.setuptools.package-data]
epoc_studio = ["assets/*", "assets/vendor/three/*"]
