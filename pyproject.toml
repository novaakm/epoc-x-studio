[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "presteeg"
version = "1.0.0"
description = "prestEEG: unified EEG acquisition, live waveforms, headmap, 3D brain map, LSL web server, and CSV compare desktop suite"
readme = "README.md"
authors = [
    { name = "Michal Novák" },
    { name = "Ondřej Bojar" },
]
requires-python = ">=3.10"
dependencies = [
    "bleak>=0.21",
    "cryptography>=41",
    "numpy>=1.24",
    "PyQt6>=6.6",
    "PyQt6-WebEngine>=6.6",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
lsl = ["pylsl>=1.16"]

[project.scripts]
presteeg-record = "presteeg.record_cli:main"
presteeg-headmap = "presteeg.headmap_view:main"
presteeg-live-viewer = "presteeg.live_viewer_view:main"
presteeg-brain-map = "presteeg.brain_map_view:main"
presteeg-csv-compare = "presteeg.csv_compare_view:main"
presteeg-take-notes = "presteeg.notes_cli:main"
presteeg-save-lsl = "presteeg.lsl_cli:save_lsl_main"
presteeg-from-lsl = "presteeg.lsl_cli:from_lsl_main"
presteeg-lsl-brain-server = "presteeg.lsl_brain_server:main"
# Compatibility entry points for external LSL / activity-logger integrations
epoc-lsl-brain-server = "presteeg.lsl_brain_server:main"
epoc-headmap = "presteeg.headmap_view:main"
epoc-brain-map = "presteeg.brain_map_view:main"
epoc-live-viewer = "presteeg.live_viewer_view:main"
epoc-save-lsl = "presteeg.lsl_cli:save_lsl_main"
epoc-from-lsl = "presteeg.lsl_cli:from_lsl_main"
epoc-take-notes = "presteeg.notes_cli:main"

[project.gui-scripts]
presteeg = "presteeg.launcher:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["presteeg*", "epoc_studio*"]

[tool.setuptools.package-data]
presteeg = ["assets/*", "assets/vendor/three/*"]
